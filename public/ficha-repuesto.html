<body>


<header>

    <div class="header">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo"
        >

        <div>

            <h1>
                FICHA DE REPUESTO
            </h1>

            <div class="subtitulo">
                Área de Ingeniería Biomédica
            </div>

        </div>

    </div>

</header>


<main>


    <div class="acciones">

        <a
            id="volver"
            class="volver"
            href="#"
        >
            ← Volver a repuestos
        </a>


        <button
            type="button"
            class="boton-imprimir"
            onclick="window.print()"
        >
            🖨️ Imprimir ficha
        </button>

    </div>


    <div
        id="contenidoPrincipal"
        class="tarjeta"
    >

        <div class="cargando">
            Cargando información del repuesto...
        </div>

    </div>


</main>


<script>


const parametros =
    new URLSearchParams(
        window.location.search
    );


const repuestoId =
    parametros.get("repuestoId");


const equipoId =
    parametros.get("equipoId");



/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "No especificado";

    }


    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================================
   OBTENER VALOR
   ========================================================= */

function obtenerValor(
    objeto,
    propiedades
) {

    for (
        const propiedad of propiedades
    ) {

        if (
            objeto[propiedad] !== undefined &&
            objeto[propiedad] !== null &&
            objeto[propiedad] !== ""
        ) {

            return objeto[propiedad];

        }

    }


    return "";

}



/* =========================================================
   OBTENER URL DE FOTOGRAFÍA
   ========================================================= */

function obtenerURLFotografia(
    fotografia
) {

    if (!fotografia) {

        return "";

    }


    if (
        typeof fotografia === "string"
    ) {

        return fotografia;

    }


    if (
        Array.isArray(fotografia)
    ) {

        if (
            fotografia.length === 0
        ) {

            return "";

        }


        const primera =
            fotografia[0];


        if (
            typeof primera === "string"
        ) {

            return primera;

        }


        if (
            primera &&
            primera.url
        ) {

            return primera.url;

        }


        if (
            primera &&
            primera.thumbnails &&
            primera.thumbnails.large
        ) {

            return primera.thumbnails.large.url;

        }

    }


    if (
        fotografia.url
    ) {

        return fotografia.url;

    }


    return "";

}



/* =========================================================
   VALIDAR ID
   ========================================================= */

if (!repuestoId) {

    document.getElementById(
        "contenidoPrincipal"
    ).innerHTML = `

        <div class="error">

            ❌ No se encontró el repuesto.

        </div>

    `;

} else {


    if (equipoId) {

        document.getElementById(
            "volver"
        ).href =
            `/repuesto.html?equipoId=${encodeURIComponent(equipoId)}`;

    } else {

        document.getElementById(
            "volver"
        ).href =
            "/";

    }


    cargarRepuesto();

}



/* =========================================================
   CARGAR REPUESTO
   ========================================================= */

async function cargarRepuesto() {

    try {


        const respuesta =
            await fetch(
                `/api/repuesto/${encodeURIComponent(repuestoId)}`
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo obtener la información del repuesto."
            );

        }



        /*
         * LA API DEVUELVE:
         *
         * {
         *     correcto: true,
         *     repuesto: {...}
         * }
         *
         * Por eso primero obtenemos
         * respuestaJSON.repuesto
         */


        const respuestaJSON =
            await respuesta.json();



        if (
            !respuestaJSON ||
            !respuestaJSON.correcto ||
            !respuestaJSON.repuesto ||
            !respuestaJSON.repuesto.id
        ) {

            console.error(
                "Respuesta recibida:",
                respuestaJSON
            );


            throw new Error(
                "No se encontró la información del repuesto."
            );

        }



        const repuesto =
            respuestaJSON.repuesto;



        /* =====================================================
           CAMPOS
           ===================================================== */


        const nombre =
            obtenerValor(
                repuesto,
                [
                    "nombre",
                    "nombreRepuesto"
                ]
            );


        const estado =
            obtenerValor(
                repuesto,
                [
                    "estado",
                    "estadoRepuesto"
                ]
            );


        const lugar =
            obtenerValor(
                repuesto,
                [
                    "lugar",
                    "lugarDondeSeEncuentra"
                ]
            );


        const observaciones =
            obtenerValor(
                repuesto,
                [
                    "observaciones"
                ]
            );


        const numeroActivo =
            obtenerValor(
                repuesto,
                [
                    "numeroActivo",
                    "numeroActivoFijo"
                ]
            );


        const serie =
            obtenerValor(
                repuesto,
                [
                    "serie",
                    "numeroSerie"
                ]
            );


        const color =
            obtenerValor(
                repuesto,
                [
                    "color"
                ]
            );


        const modelo =
            obtenerValor(
                repuesto,
                [
                    "modelo"
                ]
            );


        const compatibilidad =
            obtenerValor(
                repuesto,
                [
                    "tipoCompatibilidad",
                    "compatibilidad"
                ]
            );


        const fotografia =
            obtenerValor(
                repuesto,
                [
                    "fotografia",
                    "foto"
                ]
            );



        /* =====================================================
           FOTOGRAFÍA
           ===================================================== */

        const urlFotografia =
            obtenerURLFotografia(
                fotografia
            );


        let imagenHTML = "";


        if (urlFotografia) {

            imagenHTML = `

                <img
                    src="${escaparHTML(urlFotografia)}"
                    class="fotografia"
                    alt="Fotografía del repuesto"
                    onerror="this.style.display='none'; document.getElementById('sinFoto').style.display='flex';"
                >

                <div
                    id="sinFoto"
                    class="sin-foto"
                    style="display:none;"
                >
                    📷 No se pudo cargar la fotografía.
                </div>

            `;

        } else {

            imagenHTML = `

                <div class="sin-foto">

                    📷 Este repuesto no tiene fotografía registrada.

                </div>

            `;

        }



        /* =====================================================
           ESTADO
           ===================================================== */

        let estadoHTML =
            escaparHTML(
                estado
            );


        const estadoNormalizado =
            String(
                estado || ""
            ).toLowerCase();


        if (
            estadoNormalizado.includes("activo") ||
            estadoNormalizado.includes("disponible") ||
            estadoNormalizado.includes("operativo")
        ) {

            estadoHTML =
                `<span class="activo-si">${estadoHTML}</span>`;

        }



        /* =====================================================
           MOSTRAR FICHA
           ===================================================== */

        document.getElementById(
            "contenidoPrincipal"
        ).innerHTML = `


            <div class="titulo">

                <h2>

                    🔧 ${escaparHTML(
                        nombre ||
                        "Repuesto médico"
                    )}

                </h2>


                <p>

                    Información del repuesto

                </p>

            </div>



            <div class="contenido">


                ${imagenHTML}



                <div class="datos">


                    <!-- NOMBRE -->

                    <div class="dato">

                        <div class="etiqueta">

                            Nombre del repuesto

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                nombre
                            )}

                        </div>

                    </div>



                    <!-- ESTADO -->

                    <div class="dato">

                        <div class="etiqueta">

                            Estado del repuesto

                        </div>


                        <div class="valor">

                            ${estadoHTML}

                        </div>

                    </div>



                    <!-- ACTIVO FIJO -->

                    <div class="dato">

                        <div class="etiqueta">

                            Número de activo fijo

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                numeroActivo
                            )}

                        </div>

                    </div>



                    <!-- SERIE -->

                    <div class="dato">

                        <div class="etiqueta">

                            Número de serie

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                serie
                            )}

                        </div>

                    </div>



                    <!-- MODELO -->

                    <div class="dato">

                        <div class="etiqueta">

                            Modelo

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                modelo
                            )}

                        </div>

                    </div>



                    <!-- COLOR -->

                    <div class="dato">

                        <div class="etiqueta">

                            Color

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                color
                            )}

                        </div>

                    </div>



                    <!-- LUGAR -->

                    <div class="dato">

                        <div class="etiqueta">

                            Lugar donde se encuentra

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                lugar
                            )}

                        </div>

                    </div>



                    <!-- COMPATIBILIDAD -->

                    <div class="dato">

                        <div class="etiqueta">

                            Tipo de compatibilidad

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                compatibilidad
                            )}

                        </div>

                    </div>



                    <!-- OBSERVACIONES -->

                    <div class="dato dato-completo">

                        <div class="etiqueta">

                            Observaciones

                        </div>


                        <div class="valor">

                            ${escaparHTML(
                                observaciones
                            )}

                        </div>

                    </div>


                </div>


            </div>

        `;


    } catch (error) {


        console.error(
            "Error cargando repuesto:",
            error
        );



        document.getElementById(
            "contenidoPrincipal"
        ).innerHTML = `


            <div class="error">


                ❌ ${escaparHTML(
                    error.message ||
                    "No se pudo cargar la información del repuesto."
                )}


            </div>


        `;

    }

}

</script>


</body>
</html>
