<body>


<header>

    <div class="header-content">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo institucional"
        >

                ÁREA DE INGENIERÍA BIOMÉDICA
            </h1>

            <p>
                GESTIÓN DE EQUIPO BIOMÉDICO
            </p>

    </div>

</header>



<main class="contenedor">


    <a
        href="#"
        id="regresar"
        class="boton-regresar"
    >
        ← Regresar a ficha del equipo
    </a>



    <section class="encabezado">

        <h2>
            📋 Reportes de falla / alarma
        </h2>

        <p>
            Historial de fallas y alarmas registradas para este equipo.
        </p>


        <div
            id="equipo-info"
            class="equipo-info"
        >

            <strong>
                Cargando equipo...
            </strong>

            <span>
                Consultando información...
            </span>

        </div>

    </section>



    <div id="contenido">

        <div class="cargando">

            Cargando reportes...

        </div>

    </div>


</main>



<script>


/* =========================================================
   OBTENER ID DEL EQUIPO
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const equipoId =
    parametros.get(
        "equipoId"
    );



/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "No especificado";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   ESCAPAR ATRIBUTO
========================================================= */

function escaparAtributo(valor) {

    return String(
        valor || ""
    )

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}



/* =========================================================
   FORMATEAR FECHA
========================================================= */

function formatearFecha(valor) {

    if (!valor) {

        return "No especificado";

    }


    const fecha =
        new Date(valor);


    if (
        !isNaN(
            fecha.getTime()
        )
    ) {

        return fecha.toLocaleString(
            "es-MX",
            {

                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }
        );

    }


    return escaparHTML(
        valor
    );

}



/* =========================================================
   OBTENER DATO
========================================================= */

function obtenerDato(
    objeto,
    ...nombres
) {

    for (
        const nombre of nombres
    ) {

        if (
            objeto &&
            objeto[nombre] !== undefined &&
            objeto[nombre] !== null &&
            objeto[nombre] !== ""
        ) {

            return objeto[nombre];

        }

    }


    return "";

}



/* =========================================================
   CLASE DEL ESTADO
========================================================= */

function claseEstado(
    estado
) {

    const texto =
        String(
            estado || ""
        )
            .toLowerCase()
            .replace(
                /\s+/g,
                "-"
            );


    if (
        texto.includes(
            "pendiente"
        )
    ) {

        return "estado-pendiente";

    }


    if (
        texto.includes(
            "proceso"
        )
    ) {

        return "estado-en-proceso";

    }


    if (
        texto.includes(
            "atendido"
        )
    ) {

        return "estado-atendido";

    }


    if (
        texto.includes(
            "resuelto"
        )
    ) {

        return "estado-resuelto";

    }


    if (
        texto.includes(
            "cerrado"
        )
    ) {

        return "estado-cerrado";

    }


    if (
        texto.includes(
            "cancelado"
        )
    ) {

        return "estado-cancelado";

    }


    return "estado-pendiente";

}



/* =========================================================
   MOSTRAR ERROR
========================================================= */

function mostrarError(
    mensaje
) {

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="error">

            ❌ ${escaparHTML(
                mensaje
            )}

        </div>

    `;

}



/* =========================================================
   CARGAR INFORMACIÓN DEL EQUIPO
========================================================= */

async function cargarEquipo() {

    try {


        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(
                    equipoId
                )}`
            );


        if (
            !respuesta.ok
        ) {

            throw new Error(
                "No se pudo cargar la información del equipo."
            );

        }


        const datos =
            await respuesta.json();


        const fields =
            datos.fields ||
            {};


        const nombre =
            obtenerDato(
                datos,
                "nombre"
            ) ||
            obtenerDato(
                fields,
                "nombre del equipo",
                "Nombre del equipo",
                "Nombre",
                "nombre",
                "Equipo"
            );


        const numeroActivo =
            obtenerDato(
                datos,
                "numeroActivo",
                "numeroActivoFijo"
            ) ||
            obtenerDato(
                fields,
                "Numero de activo fijo",
                "Número de activo fijo",
                "Numero de activo",
                "Número de activo"
            );


        document.getElementById(
            "equipo-info"
        ).innerHTML = `

            <strong>

                ${escaparHTML(
                    nombre
                )}

            </strong>

            <span>

                Número de activo fijo:

                ${escaparHTML(
                    numeroActivo
                )}

            </span>

        `;


    } catch (error) {


        console.error(
            "Error cargando equipo:",
            error
        );


        document.getElementById(
            "equipo-info"
        ).innerHTML = `

            <strong>
                Equipo
            </strong>

            <span>
                No se pudo cargar la información.
            </span>

        `;

    }

}



/* =========================================================
   CARGAR REPORTES
========================================================= */

async function cargarReportes() {

    try {


        /*
         * IMPORTANTE:
         *
         * Esta es la ruta correcta del server.js:
         *
         * /api/fallas/:equipoId
         *
         * NO:
         *
         * /api/equipo/:equipoId/fallas
         */

        const respuesta =
            await fetch(
                `/api/fallas/${encodeURIComponent(
                    equipoId
                )}`
            );


        /*
         * Primero comprobamos si el servidor respondió
         * correctamente antes de procesar los datos.
         */

        if (
            !respuesta.ok
        ) {

            const textoError =
                await respuesta.text();

            console.error(
                "Respuesta del servidor:",
                textoError
            );

            throw new Error(
                "No se pudieron cargar los reportes."
            );

        }


        const datos =
            await respuesta.json();


        /*
         * El server.js devuelve directamente
         * un arreglo de reportes.
         */

        const reportes =
            Array.isArray(
                datos
            )
                ? datos
                : [];


        /*
         * SI NO EXISTEN REPORTES
         */

        if (
            reportes.length === 0
        ) {

            document.getElementById(
                "contenido"
            ).innerHTML = `

                <div class="sin-reportes">

                    <strong>
                        📋 No hay reportes registrados
                    </strong>

                    Este equipo todavía no tiene
                    fallas o alarmas registradas.

                </div>

            `;

            return;

        }



        /*
         * MOSTRAR REPORTES
         */

        document.getElementById(
            "contenido"
        ).innerHTML =

            reportes
                .map(
                    reporte => {


                        const id =
                            obtenerDato(
                                reporte,
                                "id",
                                "recordId"
                            );


                        const numero =
                            obtenerDato(
                                reporte,
                                "numeroReporte",
                                "numeroFalla",
                                "Número de reporte"
                            ) ||

                            "Reporte de falla";


                        const fecha =
                            obtenerDato(
                                reporte,
                                "fecha",
                                "fechaHora",
                                "Fecha y hora"
                            );


                        const tipo =
                            obtenerDato(
                                reporte,
                                "tipoFalla",
                                "tipo",
                                "Tipo de falla"
                            );


                        const descripcion =
                            obtenerDato(
                                reporte,
                                "descripcionFalla",
                                "descripcion",
                                "Descripción de la falla"
                            );


                        const reportado =
                            obtenerDato(
                                reporte,
                                "reportadoPor",
                                "Reportado por"
                            );


                        const estado =
                            obtenerDato(
                                reporte,
                                "estadoFalla",
                                "estado",
                                "Estado de la falla"
                            ) ||

                            "Pendiente";



                        return `

                            <div
                                class="reporte"
                                onclick="abrirReporte('${escaparAtributo(id)}')"
                            >


                                <div class="reporte-superior">


                                    <div class="reporte-numero">

                                        🔴

                                        ${escaparHTML(
                                            numero
                                        )}

                                    </div>


                                    <div class="reporte-fecha">

                                        📅

                                        ${formatearFecha(
                                            fecha
                                        )}

                                    </div>


                                </div>



                                <div class="reporte-datos">


                                    <div class="reporte-dato">

                                        <strong>
                                            Tipo de falla
                                        </strong>

                                        <span>

                                            ${escaparHTML(
                                                tipo
                                            )}

                                        </span>

                                    </div>



                                    <div class="reporte-dato">

                                        <strong>
                                            Reportado por
                                        </strong>

                                        <span>

                                            ${escaparHTML(
                                                reportado
                                            )}

                                        </span>

                                    </div>



                                    <div class="reporte-dato">

                                        <strong>
                                            Estado
                                        </strong>

                                        <span>

                                            <span
                                                class="estado ${claseEstado(
                                                    estado
                                                )}"
                                            >

                                                ${escaparHTML(
                                                    estado
                                                )}

                                            </span>

                                        </span>

                                    </div>


                                </div>



                                <div
                                    class="reporte-dato"
                                    style="margin-top:10px;"
                                >

                                    <strong>
                                        Descripción
                                    </strong>

                                    <span>

                                        ${escaparHTML(
                                            descripcion
                                        )}

                                    </span>

                                </div>



                                <div class="ver-reporte">

                                    Ver reporte completo →

                                </div>


                            </div>

                        `;

                    }
                )
                .join("");


    } catch (error) {


        console.error(
            "Error cargando reportes:",
            error
        );


        mostrarError(
            error.message ||
            "No se pudieron cargar los reportes."
        );

    }

}



/* =========================================================
   ABRIR REPORTE INDIVIDUAL
========================================================= */

function abrirReporte(
    id
) {

    if (
        !id
    ) {

        alert(
            "No se encontró el identificador del reporte."
        );

        return;

    }


    window.location.href =
        `/ficha-falla.html?fallaId=${encodeURIComponent(
            id
        )}&equipoId=${encodeURIComponent(
            equipoId
        )}`;

}



/* =========================================================
   INICIO
========================================================= */

if (
    !equipoId
) {


    mostrarError(
        "No se encontró el identificador del equipo."
    );


} else {


    document.getElementById(
        "regresar"
    ).href =
        `/index.html?equipoId=${encodeURIComponent(
            equipoId
        )}`;


    cargarEquipo();

    cargarReportes();

}

</script>


</body>
