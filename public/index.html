<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sistema Biomédico
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f8;

            color:
                #222;
        }


        header {

            background:
                #ffffff;

            border-bottom:
                1px solid #ddd;

            padding:
                20px;

            display:
                flex;

            align-items:
                center;

            gap:
                20px;
        }


        header img {

            width:
                90px;

            height:
                90px;

            object-fit:
                contain;
        }


        header h1 {

            margin:
                0;

            font-size:
                24px;

            color:
                #1f3c5b;
        }


        header p {

            margin:
                5px 0 0;

            color:
                #666;
        }


        .contenedor {

            max-width:
                1100px;

            margin:
                30px auto;

            padding:
                0 20px;
        }


        .card {

            background:
                #ffffff;

            border-radius:
                12px;

            padding:
                25px;

            margin-bottom:
                20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .titulo-equipo {

            font-size:
                28px;

            font-weight:
                bold;

            color:
                #1f3c5b;

            margin-bottom:
                10px;
        }


        .subtitulo {

            color:
                #666;

            margin-bottom:
                20px;
        }


        .foto-equipo {

            width:
                100%;

            max-height:
                400px;

            object-fit:
                contain;

            border-radius:
                10px;

            margin-bottom:
                20px;
        }


        .datos {

            display:
                grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap:
                15px;
        }


        .dato {

            border:
                1px solid #e0e0e0;

            border-radius:
                8px;

            padding:
                15px;

            background:
                #fafafa;
        }


        .dato strong {

            display:
                block;

            margin-bottom:
                5px;

            color:
                #555;
        }


        .criticidad {

            display:
                inline-block;

            padding:
                8px 14px;

            border-radius:
                20px;

            font-weight:
                bold;
        }


        .criticidad.baja {

            background:
                #d4edda;

            color:
                #155724;
        }


        .criticidad.media {

            background:
                #fff3cd;

            color:
                #856404;
        }


        .criticidad.alta {

            background:
                #f8d7da;

            color:
                #721c24;
        }


        .botones {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                10px;

            margin-top:
                20px;
        }


        button,
        .boton {

            border:
                none;

            background:
                #1f3c5b;

            color:
                white;

            padding:
                12px 18px;

            border-radius:
                8px;

            cursor:
                pointer;

            text-decoration:
                none;

            font-size:
                14px;
        }


        button:hover,
        .boton:hover {

            opacity:
                0.9;
        }


        .boton-falla {

            background:
                #c0392b;
        }


        .boton-manual {

            background:
                #6c757d;
        }


        .boton-mantenimiento {

            background:
                #2c7a7b;
        }


        .boton-imprimir {

            background:
                #555;
        }


        .seccion-titulo {

            font-size:
                22px;

            color:
                #1f3c5b;

            margin-bottom:
                15px;
        }


        .lista {

            display:
                grid;

            gap:
                10px;
        }


        .item {

            border:
                1px solid #ddd;

            border-radius:
                8px;

            padding:
                15px;

            background:
                #fff;
        }


        .item a {

            color:
                #1f3c5b;

            font-weight:
                bold;

            text-decoration:
                none;
        }


        .videos {

            display:
                grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap:
                15px;
        }


        .video-card {

            border:
                1px solid #ddd;

            border-radius:
                10px;

            padding:
                15px;

            background:
                #fafafa;
        }


        .video-card a {

            text-decoration:
                none;

            color:
                #1f3c5b;

            font-weight:
                bold;
        }


        .modal {

            display:
                none;

            position:
                fixed;

            z-index:
                1000;

            left:
                0;

            top:
                0;

            width:
                100%;

            height:
                100%;

            background:
                rgba(0,0,0,0.6);

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;
        }


        .modal-contenido {

            background:
                white;

            width:
                100%;

            max-width:
                600px;

            border-radius:
                12px;

            padding:
                25px;

            max-height:
                90vh;

            overflow-y:
                auto;
        }


        .modal-contenido h2 {

            margin-top:
                0;

            color:
                #1f3c5b;
        }


        .campo {

            margin-bottom:
                15px;
        }


        .campo label {

            display:
                block;

            margin-bottom:
                6px;

            font-weight:
                bold;

            color:
                #444;
        }


        .campo input,
        .campo select,
        .campo textarea {

            width:
                100%;

            padding:
                10px;

            border:
                1px solid #ccc;

            border-radius:
                7px;

            font-family:
                inherit;
        }


        .campo textarea {

            min-height:
                100px;

            resize:
                vertical;
        }


        .modal-botones {

            display:
                flex;

            justify-content:
                flex-end;

            gap:
                10px;

            margin-top:
                20px;
        }


        .mensaje-falla {

            display:
                none;

            padding:
                12px;

            border-radius:
                8px;

            margin-bottom:
                15px;
        }


        .mensaje-falla.exito {

            display:
                block;

            background:
                #d4edda;

            color:
                #155724;
        }


        .mensaje-falla.error {

            display:
                block;

            background:
                #f8d7da;

            color:
                #721c24;
        }


        .oculto {

            display:
                none;
        }


        @media print {

            header,
            .botones,
            .no-imprimir {

                display:
                    none !important;
            }


            body {

                background:
                    white;
            }


            .contenedor {

                max-width:
                    100%;

                margin:
                    0;

                padding:
                    0;
            }


            .card {

                box-shadow:
                    none;

                border:
                    none;
            }

        }

    </style>

</head>


<body>


<header>

    <img
        src="/img/fondo.jfif"
        alt="Logo"
    >

    <div>

        <h1>
            ÁREA DE INGENIERÍA BIOMÉDICA
        </h1>

        <p>
            GESTIÓN DE EQUIPO BIOMÉDICO
        </p>

    </div>

</header>


<div class="contenedor">


    <div
        id="mensaje"
        class="mensaje-falla"
    ></div>


    <div class="card">

        <div
            id="tituloEquipo"
            class="titulo-equipo"
        >
            Cargando equipo...
        </div>


        <div
            id="subtituloEquipo"
            class="subtitulo"
        ></div>


        <img
            id="fotoEquipo"
            class="foto-equipo"
            style="display:none;"
            alt="Fotografía del equipo"
        >


        <div
            id="datosEquipo"
            class="datos"
        ></div>


        <div class="botones no-imprimir">


            <button
                type="button"
                onclick="abrirModalFalla()"
                class="boton-falla"
            >
                🚨 Reportar falla / alarma
            </button>


            <a
                id="botonManual"
                class="boton boton-manual"
                target="_blank"
                style="display:none;"
            >
                📘 Manual
            </a>


            <a
                id="botonMantenimiento"
                class="boton boton-mantenimiento"
            >
                🔧 Mantenimiento
            </a>


            <a
                id="botonReportesFallas"
                class="boton"
            >
                🚨 Reportes de fallas
            </a>


            <button
                type="button"
                onclick="window.print()"
                class="boton-imprimir"
            >
                🖨️ Imprimir
            </button>

        </div>

    </div>


    <div
        id="seccionAccesorios"
        class="card"
    >

        <div class="seccion-titulo">
            🔌 Accesorios Médicos
        </div>

        <div
            id="listaAccesorios"
            class="lista"
        ></div>

    </div>


    <div
        id="seccionRepuestos"
        class="card"
    >

        <div class="seccion-titulo">
            ⚙️ Repuestos Médicos
        </div>

        <div
            id="listaRepuestos"
            class="lista"
        ></div>

    </div>


    <div
        id="seccionVideos"
        class="card"
    >

        <div class="seccion-titulo">
            🎥 Ayuda visual
        </div>

        <div
            id="listaVideos"
            class="videos"
        ></div>

    </div>


    <div
        id="seccionMantenimientos"
        class="card"
    >

        <div class="seccion-titulo">
            🔧 Historial de mantenimientos
        </div>

        <div
            id="listaMantenimientos"
            class="lista"
        ></div>

    </div>


</div>



<!-- MODAL FALLA -->

<div
    id="modalFalla"
    class="modal"
>

    <div class="modal-contenido">

        <h2>
            🚨 Reportar falla / alarma
        </h2>


        <div
            id="mensajeFalla"
            class="mensaje-falla"
        ></div>


        <form
            id="formularioFalla"
            onsubmit="registrarFalla(event)"
        >


            <div class="campo">

                <label>
                    Tipo de falla
                </label>

                <select
                    id="tipoFalla"
                    required
                >

                    <option value="">
                        Seleccionar
                    </option>

                    <option value="Falla técnica">
                        Falla técnica
                    </option>

                    <option value="Alarma">
                        Alarma
                    </option>

                    <option value="Daño físico">
                        Daño físico
                    </option>

                    <option value="Otro">
                        Otro
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>
                    Descripción de la falla
                </label>

                <textarea
                    id="descripcionFalla"
                    required
                ></textarea>

            </div>


            <div class="campo">

                <label>
                    Fotografía del error
                </label>

                <input
                    type="file"
                    id="fotografiaFalla"
                    accept="image/*"
                >

            </div>


            <div class="campo">

                <label>
                    Reportado por
                </label>

                <input
                    type="text"
                    id="reportadoPor"
                    required
                >

            </div>


            <div class="campo">

                <label>
                    Observaciones
                </label>

                <textarea
                    id="observacionesFalla"
                ></textarea>

            </div>


            <div class="modal-botones">

                <button
                    type="button"
                    onclick="cerrarModalFalla()"
                >
                    Cancelar
                </button>


                <button
                    type="submit"
                    class="boton-falla"
                >
                    Registrar falla
                </button>

            </div>


        </form>

    </div>

</div>



<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const equipoId =
    params.get("equipoId");



function mostrarMensaje(
    texto,
    error = false
) {

    const mensaje =
        document.getElementById(
            "mensaje"
        );

    mensaje.textContent =
        texto;

    mensaje.className =
        error
            ? "mensaje-falla error"
            : "mensaje-falla exito";

}



function mostrarMensajeFalla(
    texto,
    error = false
) {

    const mensaje =
        document.getElementById(
            "mensajeFalla"
        );

    mensaje.textContent =
        texto;

    mensaje.className =
        error
            ? "mensaje-falla error"
            : "mensaje-falla exito";

}



function abrirModalFalla() {

    document.getElementById(
        "modalFalla"
    ).style.display =
        "flex";

}



function cerrarModalFalla() {

    document.getElementById(
        "modalFalla"
    ).style.display =
        "none";

}



async function cargarEquipo() {

    if (!equipoId) {

        mostrarMensaje(
            "Equipo no especificado.",
            true
        );

        return;

    }


    try {

        const respuesta =
            await fetch(
                `/api/equipo/${equipoId}`
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar el equipo."
            );

        }


        const datos =
            await respuesta.json();


        mostrarEquipo(
            datos
        );

    }

    catch (error) {

        console.error(
            error
        );

        mostrarMensaje(
            error.message ||
            "Error al cargar el equipo.",
            true
        );

    }

}



function mostrarEquipo(
    equipo
) {

    document.getElementById(
        "tituloEquipo"
    ).textContent =
        equipo["Nombre del equipo"] ||
        equipo["nombre del equipo"] ||
        "Equipo biomédico";


    document.getElementById(
        "subtituloEquipo"
    ).textContent =
        `Activo fijo: ${
            equipo["Número de activo fijo"] ||
            equipo["Numero de activo fijo"] ||
            "No especificado"
        }`;


    const foto =
        document.getElementById(
            "fotoEquipo"
        );


    const fotografia =
        equipo["Fotografía del equipo"] ||
        equipo["fotografia del equipo"];


    if (
        Array.isArray(fotografia) &&
        fotografia.length > 0
    ) {

        foto.src =
            fotografia[0].url;

        foto.style.display =
            "block";

    }


    const datos =
        document.getElementById(
            "datosEquipo"
        );


    datos.innerHTML = "";


    const campos = [

        [
            "Número de activo fijo",
            equipo["Número de activo fijo"] ||
            equipo["Numero de activo fijo"]
        ],

        [
            "Marca",
            equipo["Marca"]
        ],

        [
            "Modelo",
            equipo["Modelo"]
        ],

        [
            "Número de serie",
            equipo["Número de serie"] ||
            equipo["Numero de serie"]
        ],

        [
            "Servicio o área",
            equipo["Servicio o área"] ||
            equipo["Servicio o area"]
        ],

        [
            "Ubicación",
            equipo["Ubicación"] ||
            equipo["Ubicacion"]
        ],

        [
            "Responsable",
            equipo["Responsable"]
        ],

        [
            "Estado del equipo",
            equipo["Estado del equipo"]
        ],

        [
            "Condición Física",
            equipo["Condición Física"]
        ],

        [
            "Criticidad",
            equipo["Criticidad"]
        ],

        [
            "Fecha de adquisición",
            equipo["Fecha de adquisición"]
        ],

        [
            "Proveedor",
            equipo["Proveedor"]
        ],

        [
            "Garantía",
            equipo["Garantía"]
        ],

        [
            "Fecha de último mantenimiento",
            equipo["Fecha de ultimo mantenimiento"] ||
            equipo["Fecha de último mantenimiento"]
        ],

        [
            "Fecha de próximo mantenimiento",
            equipo["Fecha de próximo mantenimiento"] ||
            equipo["Fecha de proximo mantenimiento"]
        ]

    ];


    campos.forEach(
        ([nombre, valor]) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "dato";


            const strong =
                document.createElement(
                    "strong"
                );


            strong.textContent =
                nombre;


            div.appendChild(
                strong
            );


            if (
                nombre ===
                "Criticidad"
            ) {

                const span =
                    document.createElement(
                        "span"
                    );


                const criticidad =
                    String(
                        valor ||
                        ""
                    ).toLowerCase();


                span.className =
                    "criticidad " +
                    (
                        criticidad.includes(
                            "alta"
                        )
                            ? "alta"
                            : criticidad.includes(
                                "media"
                            )
                                ? "media"
                                : "baja"
                    );


                span.textContent =
                    valor ||
                    "No especificado";


                div.appendChild(
                    span
                );

            }

            else {

                const texto =
                    document.createElement(
                        "span"
                    );


                texto.textContent =
                    valor ||
                    "No especificado";


                div.appendChild(
                    texto
                );

            }


            datos.appendChild(
                div
            );

        }
    );


    cargarAccesorios();


    cargarRepuestos();


    cargarVideos();


    cargarMantenimientos();


    const manual =
        equipo["URL manuales"];


    const botonManual =
        document.getElementById(
            "botonManual"
        );


    if (
        manual
    ) {

        botonManual.href =
            manual;

        botonManual.style.display =
            "inline-block";

    }


    document.getElementById(
        "botonMantenimiento"
    ).href =
        `/mantenimiento.html?equipoId=${equipoId}`;


    document.getElementById(
        "botonReportesFallas"
    ).href =
        `/fallas.html?equipoId=${equipoId}`;

}



async function cargarAccesorios() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${equipoId}/accesorios`
            );


        if (!respuesta.ok)
            return;


        const datos =
            await respuesta.json();


        const lista =
            document.getElementById(
                "listaAccesorios"
            );


        lista.innerHTML = "";


        if (
            !Array.isArray(datos) ||
            datos.length === 0
        ) {

            lista.innerHTML =
                "<div class='item'>No hay accesorios relacionados.</div>";

            return;

        }


        datos.forEach(
            accesorio => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "item";


                item.innerHTML = `
                    <a href="/ficha-accesorio.html?accesorioId=${accesorio.id}">
                        🔌 ${
                            accesorio["Nombre del accesorio"] ||
                            accesorio["nombre"] ||
                            "Accesorio"
                        }
                    </a>
                `;


                lista.appendChild(
                    item
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Error al cargar accesorios:",
            error
        );

    }

}



async function cargarRepuestos() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${equipoId}/repuestos`
            );


        if (!respuesta.ok)
            return;


        const datos =
            await respuesta.json();


        const lista =
            document.getElementById(
                "listaRepuestos"
            );


        lista.innerHTML = "";


        if (
            !Array.isArray(datos) ||
            datos.length === 0
        ) {

            lista.innerHTML =
                "<div class='item'>No hay repuestos relacionados.</div>";

            return;

        }


        datos.forEach(
            repuesto => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "item";


                item.innerHTML = `
                    <a href="/ficha-repuesto.html?repuestoId=${repuesto.id}">
                        ⚙️ ${
                            repuesto["Nombre del repuesto"] ||
                            repuesto["nombre"] ||
                            "Repuesto"
                        }
                    </a>
                `;


                lista.appendChild(
                    item
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Error al cargar repuestos:",
            error
        );

    }

}



async function cargarVideos() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${equipoId}`
            );


        if (!respuesta.ok)
            return;


        const equipo =
            await respuesta.json();


        const lista =
            document.getElementById(
                "listaVideos"
            );


        lista.innerHTML = "";


        for (
            let i = 1;
            i <= 4;
            i++
        ) {

            const titulo =
                equipo[
                    `Título del video ${i}`
                ];


            const url =
                equipo[
                    `URL del video ${i} (YouTube)`
                ];


            if (
                titulo &&
                url
            ) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "video-card";


                card.innerHTML = `
                    <a
                        href="${url}"
                        target="_blank"
                    >
                        🎥 ${titulo}
                    </a>
                `;


                lista.appendChild(
                    card
                );

            }

        }


        if (
            !lista.innerHTML
        ) {

            lista.innerHTML =
                "<div class='item'>No hay videos de ayuda visual.</div>";

        }

    }

    catch (error) {

        console.error(
            "Error al cargar videos:",
            error
        );

    }

}



async function cargarMantenimientos() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${equipoId}/mantenimientos`
            );


        if (!respuesta.ok)
            return;


        const datos =
            await respuesta.json();


        const lista =
            document.getElementById(
                "listaMantenimientos"
            );


        lista.innerHTML = "";


        if (
            !Array.isArray(datos) ||
            datos.length === 0
        ) {

            lista.innerHTML =
                "<div class='item'>No hay mantenimientos registrados.</div>";

            return;

        }


        datos.forEach(
            mantenimiento => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "item";


                item.innerHTML = `

                    <strong>
                        ${
                            mantenimiento[
                                "Tipo de mantenimiento"
                            ] ||
                            "Mantenimiento"
                        }
                    </strong>

                    <br>

                    Fecha:
                    ${
                        mantenimiento[
                            "Fecha de mantenimiento realizado"
                        ] ||
                        "No especificada"
                    }

                    <br>

                    Técnico:
                    ${
                        mantenimiento[
                            "Técnico responsable"
                        ] ||
                        "No especificado"
                    }

                    <br>

                    Estado:
                    ${
                        mantenimiento[
                            "Estado del mantenimiento"
                        ] ||
                        "No especificado"
                    }

                `;


                lista.appendChild(
                    item
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Error al cargar mantenimientos:",
            error
        );

    }

}



async function registrarFalla(
    event
) {

    event.preventDefault();


    mostrarMensajeFalla(
        "",
        false
    );


    const formulario =
        document.getElementById(
            "formularioFalla"
        );


    const formData =
        new FormData();


    formData.append(
        "tipoFalla",
        document.getElementById(
            "tipoFalla"
        ).value
    );


    formData.append(
        "descripcionFalla",
        document.getElementById(
            "descripcionFalla"
        ).value
    );


    formData.append(
        "reportadoPor",
        document.getElementById(
            "reportadoPor"
        ).value
    );


    formData.append(
        "observaciones",
        document.getElementById(
            "observacionesFalla"
        ).value
    );


    formData.append(
        "equipoId",
        equipoId
    );


    const fotografia =
        document.getElementById(
            "fotografiaFalla"
        );


    if (
        fotografia.files.length > 0
    ) {

        formData.append(
            "fotografia",
            fotografia.files[0]
        );

    }


    try {

        const respuesta =
            await fetch(
                "/api/falla",
                {
                    method:
                        "POST",

                    body:
                        formData
                }
            );


        const datos =
            await respuesta.json();


        /* ÚNICO CAMBIO: RESPUESTA CORRECTA DEL SERVER */

        if (
            !respuesta.ok ||
            !datos.success
        ) {

            throw new Error(
                datos.error ||
                "No se pudo registrar la falla."
            );

        }


        mostrarMensajeFalla(
            `Falla #${datos.numeroFalla || ""} registrada correctamente.`,
            false
        );


        formulario.reset();


        setTimeout(
            () => {

                cerrarModalFalla();

                mostrarMensaje(
                    `Falla #${datos.numeroFalla || ""} registrada correctamente.`,
                    false
                );

            },
            1500
        );

    }

    catch (error) {

        console.error(
            "Error al registrar falla:",
            error
        );


        mostrarMensajeFalla(
            error.message ||
            "No se pudo registrar la falla.",
            true
        );

    }

}

        const modal =
            document.getElementById(
                "modalFalla"
            );


        if (
            event.target === modal
        ) {

            cerrarModalFalla();

        }

    }
);
