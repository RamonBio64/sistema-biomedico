<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha Técnica | Equipo Biomédico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f8;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #0b3d4a, #126579);
            color: white;
            padding: 18px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 5px;
        }

        .header-text h1 {
            margin: 0;
            font-size: 22px;
        }

        .header-text p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .contenedor {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .titulo-equipo {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .titulo-equipo h2 {
            margin: 0 0 8px;
            color: #0b3d4a;
            font-size: 28px;
        }

        .activo {
            font-size: 16px;
            color: #607d8b;
            font-weight: bold;
        }

        .criticidad {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 14px;
            border-radius: 20px;
            background: #ffebee;
            color: #c62828;
            font-weight: bold;
            font-size: 13px;
        }

        .foto-equipo {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            background: #fafafa;
            border-radius: 12px;
            margin-top: 20px;
        }

        .seccion {
            background: white;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .seccion h3 {
            margin-top: 0;
            color: #0b3d4a;
            border-bottom: 2px solid #e5ecef;
            padding-bottom: 12px;
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .dato {
            background: #f7f9fa;
            padding: 13px;
            border-radius: 9px;
            border-left: 4px solid #126579;
        }

        .dato strong {
            display: block;
            color: #607d8b;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .dato span {
            font-size: 15px;
            font-weight: 600;
        }

        .acceso-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 20px;
            border: 1px solid #dce5e8;
            border-radius: 13px;
            text-decoration: none;
            color: #263238;
            transition: 0.2s;
            cursor: pointer;
        }

        .acceso-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.10);
            border-color: #126579;
        }

        .acceso-izq {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .acceso-icono {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #e8f4f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .acceso-info strong {
            display: block;
            font-size: 17px;
            color: #0b3d4a;
            margin-bottom: 5px;
        }

        .acceso-info span {
            color: #607d8b;
            font-size: 14px;
        }

        .flecha {
            font-size: 25px;
            color: #126579;
            font-weight: bold;
        }

        .mantenimiento-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            background: #0b3d4a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .mantenimiento-btn:hover {
            background: #126579;
        }

        .historial-item {
            border-left: 4px solid #126579;
            background: #f7f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .historial-item strong {
            color: #0b3d4a;
        }

        .cargando {
            text-align: center;
            padding: 30px;
            color: #607d8b;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .grid-info {
                grid-template-columns: 1fr;
            }

            .titulo-equipo h2 {
                font-size: 23px;
            }

            .header-text h1 {
                font-size: 18px;
            }

            .logo {
                width: 55px;
                height: 55px;
            }

            .acceso-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo institucional"
        >

        <div class="header-text">
            <h1>ÁREA DE INGENIERÍA BIOMÉDICA</h1>
            <p>GESTIÓN DE EQUIPO BIOMÉDICO</p>
        </div>

    </div>
</header>

<main class="contenedor">

    <div id="contenido">

        <div class="cargando">
            Cargando ficha técnica...
        </div>

    </div>

</main>

<script>

const parametros = new URLSearchParams(window.location.search);
const equipoId = parametros.get("equipoId");


function escaparHTML(valor) {

    if (valor === null || valor === undefined || valor === "") {
        return "No especificado";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function mostrarError(mensaje) {

    document.getElementById("contenido").innerHTML = `
        <div class="error">
            ❌ ${escaparHTML(mensaje)}
        </div>
    `;
}


if (!equipoId) {

    mostrarError(
        "No se encontró el identificador del equipo. La URL debe contener ?equipoId=..."
    );

} else {

    cargarEquipo();
}


async function cargarEquipo() {

    try {

        const respuesta =
            await fetch(`/api/equipo/${encodeURIComponent(equipoId)}`);

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo obtener la información del equipo."
            );

        }

        const datos =
            await respuesta.json();

        /*
         * IMPORTANTE:
         *
         * La API actual devuelve directamente:
         *
         * {
         *   id: "...",
         *   nombre: "...",
         *   numeroActivo: "...",
         *   ...
         * }
         *
         * NO devuelve datos.correcto.
         */

        if (!datos || !datos.id) {

            throw new Error(
                "No se encontró el equipo."
            );

        }

        mostrarEquipo(datos);

        /*
         * Después de mostrar la ficha principal,
         * cargamos la información secundaria.
         */

        cargarCantidadAccesorios();
        cargarCantidadRepuestos();
        cargarMantenimiento();

    } catch (error) {

        console.error(
            "Error cargando equipo:",
            error
        );

        mostrarError(
            error.message || "No se pudo cargar la ficha técnica."
        );

    }

}


function obtenerFoto(datos) {

    if (!datos.fotografia) {
        return "";
    }

    /*
     * Airtable devuelve los archivos adjuntos
     * como un arreglo.
     */

    if (Array.isArray(datos.fotografia)) {

        if (datos.fotografia.length === 0) {
            return "";
        }

        return datos.fotografia[0].url || "";

    }

    /*
     * Compatibilidad por si posteriormente
     * el servidor devuelve directamente una URL.
     */

    if (typeof datos.fotografia === "string") {
        return datos.fotografia;
    }

    return "";
}


function mostrarEquipo(datos) {

    const fotografia =
        obtenerFoto(datos);

    document.getElementById("contenido").innerHTML = `

        <section class="titulo-equipo">

            <h2>
                ${escaparHTML(datos.nombre)}
            </h2>

            <div class="activo">
                Número de activo fijo:
                ${escaparHTML(datos.numeroActivo)}
            </div>

            <div class="criticidad">
                ${escaparHTML(
                    datos.criticidad || "Sin especificar"
                )}
            </div>

            ${
                fotografia
                ?
                `<img
                    src="${escaparHTML(fotografia)}"
                    class="foto-equipo"
                    alt="Fotografía del equipo"
                >`
                :
                ""
            }

        </section>


        <section class="seccion">

            <h3>📋 Información del Equipo</h3>

            <div class="grid-info">

                <div class="dato">
                    <strong>Servicio / Área</strong>
                    <span>
                        ${escaparHTML(datos.servicio)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Nombre del equipo</strong>
                    <span>
                        ${escaparHTML(datos.nombre)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Marca</strong>
                    <span>
                        ${escaparHTML(datos.marca)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Modelo</strong>
                    <span>
                        ${escaparHTML(datos.modelo)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Número de serie</strong>
                    <span>
                        ${escaparHTML(datos.serie)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Ubicación</strong>
                    <span>
                        ${escaparHTML(datos.ubicacion)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Responsable</strong>
                    <span>
                        ${escaparHTML(datos.responsable)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Estado del equipo</strong>
                    <span>
                        ${escaparHTML(datos.estado)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Garantía</strong>
                    <span>
                        ${escaparHTML(datos.garantia)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Condición física</strong>
                    <span>
                        ${escaparHTML(datos.condicionFisica)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Fecha de adquisición</strong>
                    <span>
                        ${escaparHTML(datos.fechaAdquisicion)}
                    </span>
                </div>

                <div class="dato">
                    <strong>Proveedor</strong>
                    <span>
                        ${escaparHTML(datos.proveedor)}
                    </span>
                </div>

            </div>

        </section>


        <section class="seccion">

            <h3>🔌 Accesorios Médicos</h3>

            <a
                class="acceso-card"
                href="/accesorio.html?equipoId=${encodeURIComponent(equipoId)}"
            >

                <div class="acceso-izq">

                    <div class="acceso-icono">
                        🔌
                    </div>

                    <div class="acceso-info">

                        <strong>
                            Accesorios del equipo
                        </strong>

                        <span id="cantidad-accesorios">
                            Consultando accesorios...
                        </span>

                    </div>

                </div>

                <div class="flecha">
                    →
                </div>

            </a>

        </section>


        <section class="seccion">

            <h3>🔧 Repuestos Médicos</h3>

            <a
                class="acceso-card"
                href="/repuesto.html?equipoId=${encodeURIComponent(equipoId)}"
            >

                <div class="acceso-izq">

                    <div class="acceso-icono">
                        🔧
                    </div>

                    <div class="acceso-info">

                        <strong>
                            Repuestos del equipo
                        </strong>

                        <span id="cantidad-repuestos">
                            Consultando repuestos...
                        </span>

                    </div>

                </div>

                <div class="flecha">
                    →
                </div>

            </a>

        </section>


        <section class="seccion">

            <h3>🛠️ Información de Mantenimiento</h3>

            <div id="mantenimiento-info">

                <div class="cargando">
                    Cargando información...
                </div>

            </div>

        </section>


        <section class="seccion">

            <h3>📋 Historial de Mantenimiento</h3>

            <div id="historial">

                <div class="cargando">
                    Cargando historial...
                </div>

            </div>

        </section>


        <section class="seccion">

            <button
                class="mantenimiento-btn"
                onclick="accederMantenimiento()"
            >
                🔧 Acceder a Mantenimiento
            </button>

        </section>

    `;
}


async function cargarCantidadAccesorios() {

    const elemento =
        document.getElementById(
            "cantidad-accesorios"
        );

    if (!elemento) return;

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}/accesorios`
            );

        const datos =
            await respuesta.json();

        if (
            datos.correcto &&
            Array.isArray(datos.accesorios)
        ) {

            const cantidad =
                datos.accesorios.length;

            elemento.textContent =
                cantidad === 1
                ? "1 accesorio disponible · Ver accesorios →"
                : `${cantidad} accesorios disponibles · Ver accesorios →`;

        } else {

            elemento.textContent =
                "Ver accesorios del equipo →";

        }

    } catch (error) {

        console.error(error);

        elemento.textContent =
            "Ver accesorios del equipo →";

    }

}


async function cargarCantidadRepuestos() {

    const elemento =
        document.getElementById(
            "cantidad-repuestos"
        );

    if (!elemento) return;

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}/repuestos`
            );

        const datos =
            await respuesta.json();

        if (
            datos.correcto &&
            Array.isArray(datos.repuestos)
        ) {

            const cantidad =
                datos.repuestos.length;

            elemento.textContent =
                cantidad === 1
                ? "1 repuesto disponible · Ver repuestos →"
                : `${cantidad} repuestos disponibles · Ver repuestos →`;

        } else {

            elemento.textContent =
                "Ver repuestos del equipo →";

        }

    } catch (error) {

        console.error(error);

        elemento.textContent =
            "Ver repuestos del equipo →";

    }

}


async function cargarMantenimiento() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}/mantenimientos`
            );

        const datos =
            await respuesta.json();

        const contenedor =
            document.getElementById(
                "mantenimiento-info"
            );

        const historial =
            document.getElementById(
                "historial"
            );


        if (
            !datos.correcto ||
            !Array.isArray(datos.mantenimientos)
        ) {

            contenedor.innerHTML =
                `<p>No hay información de mantenimiento.</p>`;

            historial.innerHTML =
                `<p>No hay historial de mantenimiento.</p>`;

            return;

        }


        const mantenimientos =
            datos.mantenimientos;


        if (mantenimientos.length === 0) {

            contenedor.innerHTML = `
                <p>
                    No se han registrado mantenimientos
                    para este equipo.
                </p>
            `;

            historial.innerHTML = `
                <p>
                    No existe historial de mantenimiento.
                </p>
            `;

            return;

        }


        const ultimo =
            mantenimientos[0];


        contenedor.innerHTML = `

            <div class="grid-info">

                <div class="dato">

                    <strong>
                        Último mantenimiento
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.fechaMantenimiento
                        )}
                    </span>

                </div>

                <div class="dato">

                    <strong>
                        Tipo de mantenimiento
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.tipoMantenimiento
                        )}
                    </span>

                </div>

                <div class="dato">

                    <strong>
                        Técnico responsable
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.tecnico
                        )}
                    </span>

                </div>

                <div class="dato">

                    <strong>
                        Próximo mantenimiento
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.proximoMantenimiento
                        )}
                    </span>

                </div>

            </div>

        `;


        historial.innerHTML =
            mantenimientos
                .map(
                    (mantenimiento, indice) => `

                <div class="historial-item">

                    <strong>
                        Mantenimiento #${indice + 1}
                    </strong>

                    <br><br>

                    <b>Fecha:</b>
                    ${escaparHTML(
                        mantenimiento.fechaMantenimiento
                    )}

                    <br>

                    <b>Tipo:</b>
                    ${escaparHTML(
                        mantenimiento.tipoMantenimiento
                    )}

                    <br>

                    <b>Técnico:</b>
                    ${escaparHTML(
                        mantenimiento.tecnico
                    )}

                    <br>

                    <b>Estado:</b>
                    ${escaparHTML(
                        mantenimiento.estado
                    )}

                </div>

            `
                )
                .join("");

    } catch (error) {

        console.error(
            "Error cargando mantenimiento:",
            error
        );

        const mantenimiento =
            document.getElementById(
                "mantenimiento-info"
            );

        const historial =
            document.getElementById(
                "historial"
            );

        if (mantenimiento) {

            mantenimiento.innerHTML =
                `<p>No se pudo cargar mantenimiento.</p>`;

        }

        if (historial) {

            historial.innerHTML =
                `<p>No se pudo cargar el historial.</p>`;

        }

    }

}


function accederMantenimiento() {

    const password =
        prompt(
            "Ingresa la contraseña del Área de Ingeniería Biomédica:"
        );

    if (!password) {
        return;
    }

    sessionStorage.setItem(
        "mantenimientoPassword",
        password
    );

    window.location.href =
        `/mantenimiento.html?equipoId=${encodeURIComponent(equipoId)}`;

}

</script>

</body>
</html>
