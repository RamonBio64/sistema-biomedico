<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Ficha Técnica | Equipo Biomédico
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    background:
        #f3f6f8;
    color:
        #263238;
}

header {
    background:
        linear-gradient(
            135deg,
            #0b3d4a,
            #126579
        );
    color: white;
    padding:
        18px 20px;
    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.15);
}

.header-content {
    max-width:
        1100px;
    margin:
        auto;
    display:
        flex;
    align-items:
        center;
    gap:
        15px;
}

.logo {
    width:
        65px;
    height:
        65px;
    object-fit:
        contain;
    background:
        white;
    border-radius:
        10px;
    padding:
        5px;
}

.header-text h1 {
    margin:
        0;
    font-size:
        22px;
}

.header-text p {
    margin:
        5px 0 0;
    opacity:
        0.9;
    font-size:
        14px;
}

.contenedor {
    max-width:
        1100px;
    margin:
        25px auto;
    padding:
        0 15px;
}

.titulo-equipo {
    background:
        white;
    border-radius:
        15px;
    padding:
        25px;
    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
    margin-bottom:
        20px;
}

/* =====================================================
   CRITICIDAD
===================================================== */

.criticidad {
    display:
        inline-block;
    margin-top:
        12px;
    padding:
        8px 16px;
    border-radius:
        20px;
    font-weight:
        bold;
    font-size:
        13px;
    letter-spacing:
        0.3px;
}

.criticidad-alta {
    background:
        #ffebee;
    color:
        #c62828;
    border:
        2px solid #ef5350;
}

.criticidad-media {
    background:
        #fff8e1;
    color:
        #f57f17;
    border:
        2px solid #fbc02d;
}

.criticidad-baja {
    background:
        #e8f5e9;
    color:
        #2e7d32;
    border:
        2px solid #66bb6a;
}

.criticidad-otra {
    background:
        #eceff1;
    color:
        #455a64;
    border:
        2px solid #90a4ae;
}

/* =====================================================
   CRITICIDAD + REPORTAR FALLA
===================================================== */

.criticidad-falla {
    display:
        flex;
    align-items:
        center;
    gap:
        10px;
    margin-top:
        12px;
    flex-wrap:
        wrap;
}

.criticidad-falla .criticidad {
    margin-top:
        0;
}

.criticidad-falla .falla-btn {
    width:
        auto;
    margin-bottom:
        0;
    padding:
        8px 14px;
    font-size:
        13px;
}

/* =====================================================
   FOTOGRAFÍA SEGÚN CRITICIDAD
===================================================== */

.foto-contenedor {
    width:
        100%;
    margin-top:
        20px;
    padding:
        8px;
    border-radius:
        16px;
    transition:
        0.2s;
}

.foto-contenedor.alta {
    background:
        #ef5350;
    box-shadow:
        0 4px 15px
        rgba(198,40,40,0.25);
}

.foto-contenedor.media {
    background:
        #fbc02d;
    box-shadow:
        0 4px 15px
        rgba(245,192,23,0.25);
}

.foto-contenedor.baja {
    background:
        #66bb6a;
    box-shadow:
        0 4px 15px
        rgba(46,125,50,0.20);
}

.foto-contenedor.otra {
    background:
        #90a4ae;
}

.foto-equipo {
    display:
        block;
    width:
        100%;
    max-height:
        400px;
    object-fit:
        contain;
    background:
        #fafafa;
    border-radius:
        10px;
}

/* =====================================================
   SECCIONES
===================================================== */

.seccion {
    background:
        white;
    border-radius:
        15px;
    padding:
        22px;
    margin-bottom:
        20px;
    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.07);
}

.seccion h3 {
    margin-top:
        0;
    color:
        #0b3d4a;
    border-bottom:
        2px solid
        #e5ecef;
    padding-bottom:
        12px;
}

.grid-info {
    display:
        grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap:
        12px;
}

.dato {
    background:
        #f7f9fa;
    padding:
        13px;
    border-radius:
        9px;
    border-left:
        4px solid
        #126579;
}

.dato strong {
    display:
        block;
    color:
        #607d8b;
    font-size:
        12px;
    margin-bottom:
        4px;
}

.dato span {
    font-size:
        15px;
    font-weight:
        600;
}

/* =====================================================
   ACCESOS
===================================================== */

.acceso-card {
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    gap:
        15px;
    padding:
        20px;
    border:
        1px solid
        #dce5e8;
    border-radius:
        13px;
    text-decoration:
        none;
    color:
        #263238;
    transition:
        0.2s;
    cursor:
        pointer;
}

.acceso-card:hover {
    transform:
        translateY(-2px);
    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.10);
    border-color:
        #126579;
}

.acceso-izq {
    display:
        flex;
    align-items:
        center;
    gap:
        15px;
}

.acceso-icono {
    width:
        52px;
    height:
        52px;
    border-radius:
        12px;
    background:
        #e8f4f7;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        26px;
    flex-shrink:
        0;
}

.acceso-info strong {
    display:
        block;
    font-size:
        17px;
    color:
        #0b3d4a;
    margin-bottom:
        5px;
}

.acceso-info span {
    color:
        #607d8b;
    font-size:
        14px;
}

.flecha {
    font-size:
        25px;
    color:
        #126579;
    font-weight:
        bold;
}

/* =====================================================
   MANTENIMIENTO
===================================================== */

.mantenimiento-btn {
    width:
        100%;
    border:
        none;
    border-radius:
        12px;
    padding:
        16px;
    background:
        #0b3d4a;
    color:
        white;
    font-size:
        16px;
    font-weight:
        bold;
    cursor:
        pointer;
}

.mantenimiento-btn:hover {
    background:
        #126579;
}

/* =====================================================
   REPORTAR FALLA / ALARMA
===================================================== */

.falla-btn {
    width:
        100%;
    border:
        none;
    border-radius:
        12px;
    padding:
        16px;
    background:
        #c62828;
    color:
        white;
    font-size:
        16px;
    font-weight:
        bold;
    cursor:
        pointer;
    margin-bottom:
        12px;
}

.falla-btn:hover {
    background:
        #b71c1c;
}

.falla-modal {
    display:
        none;
    position:
        fixed;
    inset:
        0;
    z-index:
        9999;
    background:
        rgba(0,0,0,0.60);
    padding:
        20px;
    overflow-y:
        auto;
}

.falla-modal.activo {
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
}

.falla-contenido {
    width:
        100%;
    max-width:
        600px;
    background:
        white;
    border-radius:
        15px;
    padding:
        24px;
    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.25);
}

.falla-titulo {
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    gap:
        15px;
    margin-bottom:
        20px;
}

.falla-titulo h3 {
    margin:
        0;
    color:
        #c62828;
    border:
        none;
    padding:
        0;
}

.falla-cerrar {
    border:
        none;
    background:
        #eceff1;
    color:
        #455a64;
    width:
        38px;
    height:
        38px;
    border-radius:
        50%;
    font-size:
        20px;
    cursor:
        pointer;
}

.falla-campo {
    margin-bottom:
        16px;
}

.falla-campo label {
    display:
        block;
    font-weight:
        bold;
    font-size:
        13px;
    color:
        #455a64;
    margin-bottom:
        6px;
}

.falla-campo input,
.falla-campo select,
.falla-campo textarea {
    width:
        100%;
    border:
        1px solid
        #cfd8dc;
    border-radius:
        9px;
    padding:
        12px;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size:
        14px;
    color:
        #263238;
}

.falla-campo input:focus,
.falla-campo select:focus,
.falla-campo textarea:focus {
    outline:
        none;
    border-color:
        #126579;
    box-shadow:
        0 0 0 2px
        rgba(18,101,121,0.10);
}

.falla-campo textarea {
    min-height:
        110px;
    resize:
        vertical;
}

.falla-equipo {
    background:
        #f7f9fa;
    border-left:
        4px solid
        #c62828;
    border-radius:
        9px;
    padding:
        12px;
    margin-bottom:
        18px;
}

.falla-equipo strong {
    display:
        block;
    color:
        #0b3d4a;
    margin-bottom:
        4px;
}

.falla-equipo span {
    display:
        block;
    color:
        #607d8b;
    font-size:
        13px;
}

.falla-acciones {
    display:
        grid;
    grid-template-columns:
        1fr 1fr;
    gap:
        10px;
    margin-top:
        20px;
}

.falla-cancelar,
.falla-guardar {
    border:
        none;
    border-radius:
        10px;
    padding:
        14px;
    font-size:
        15px;
    font-weight:
        bold;
    cursor:
        pointer;
}

.falla-cancelar {
    background:
        #eceff1;
    color:
        #455a64;
}

.falla-guardar {
    background:
        #c62828;
    color:
        white;
}

.falla-guardar:hover {
    background:
        #b71c1c;
}

.falla-guardar:disabled {
    opacity:
        0.65;
    cursor:
        wait;
}

.falla-mensaje {
    display:
        none;
    padding:
        12px;
    border-radius:
        9px;
    margin-bottom:
        15px;
    font-size:
        14px;
    font-weight:
        bold;
}

.falla-mensaje.error {
    display:
        block;
    background:
        #ffebee;
    color:
        #b71c1c;
}

.falla-mensaje.exito {
    display:
        block;
    background:
        #e8f5e9;
    color:
        #2e7d32;
}

/* =====================================================
   ALERTAS DE MANTENIMIENTO
===================================================== */

.alerta-mantenimiento {
    display:
        flex;
    flex-direction:
        column;
    gap:
        5px;
    padding:
        15px 18px;
    border-radius:
        12px;
    margin-bottom:
        15px;
    border:
        2px solid;
    line-height:
        1.45;
    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.05);
}

.alerta-mantenimiento strong {
    display:
        block;
    font-size:
        15px;
}

.alerta-mantenimiento span {
    display:
        block;
    font-weight:
        normal;
    font-size:
        13px;
}

.alerta-mantenimiento.verde {
    background:
        #e8f5e9;
    color:
        #2e7d32;
    border-color:
        #66bb6a;
}

.alerta-mantenimiento.amarillo {
    background:
        #fff8e1;
    color:
        #f57f17;
    border-color:
        #fbc02d;
}

.alerta-mantenimiento.naranja {
    background:
        #fff3e0;
    color:
        #e65100;
    border-color:
        #ff9800;
}

.alerta-mantenimiento.rojo {
    background:
        #ffebee;
    color:
        #c62828;
    border-color:
        #ef5350;
}

/* =====================================================
   BOTÓN IMPRIMIR
===================================================== */

.imprimir-btn {
    width:
        100%;
    border:
        none;
    border-radius:
        12px;
    padding:
        16px;
    background:
        #126579;
    color:
        white;
    font-size:
        16px;
    font-weight:
        bold;
    cursor:
        pointer;
    margin-bottom:
        20px;
}

.imprimir-btn:hover {
    background:
        #0b3d4a;
}

/* =====================================================
   AYUDA VISUAL
===================================================== */

.ayuda-visual {
    border:
        2px solid
        #e1eef1;
    background:
        linear-gradient(
            135deg,
            #f8fcfd,
            #eef7f9
        );
}

.ayuda-descripcion {
    margin:
        -3px 0 18px;
    color:
        #607d8b;
    font-size:
        14px;
    line-height:
        1.5;
}

.videos-grid {
    display:
        grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap:
        14px;
}

.video-card {
    display:
        flex;
    align-items:
        center;
    gap:
        14px;
    width:
        100%;
    padding:
        16px;
    border:
        1px solid
        #d9e6e9;
    border-radius:
        13px;
    background:
        white;
    text-align:
        left;
    cursor:
        pointer;
    transition:
        0.2s;
}

.video-card:hover {
    transform:
        translateY(-2px);
    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.10);
    border-color:
        #126579;
}

.video-icono {
    width:
        50px;
    height:
        50px;
    min-width:
        50px;
    border-radius:
        50%;
    background:
        #e8f4f7;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        22px;
}

.video-info {
    flex:
        1;
    min-width:
        0;
}

.video-info strong {
    display:
        block;
    color:
        #0b3d4a;
    font-size:
        15px;
    line-height:
        1.35;
}

.video-info span {
    display:
        block;
    margin-top:
        5px;
    color:
        #607d8b;
    font-size:
        12px;
}

.video-flecha {
    color:
        #126579;
    font-size:
        22px;
    font-weight:
        bold;
}

/* =====================================================
   HISTORIAL
===================================================== */

.historial-item {
    display:
        block;
    border:
        1px solid
        #dce5e8;
    border-left:
        5px solid
        #126579;
    background:
        #f7f9fa;
    padding:
        18px;
    border-radius:
        10px;
    margin-bottom:
        12px;
    text-decoration:
        none;
    color:
        #263238;
    transition:
        0.2s;
    cursor:
        pointer;
}

.historial-item:hover {
    transform:
        translateY(-2px);
    background:
        #ffffff;
    border-color:
        #126579;
    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.10);
}

.historial-superior {
    display:
        flex;
    justify-content:
        space-between;
    align-items:
        center;
    gap:
        10px;
    margin-bottom:
        12px;
}

.historial-titulo {
    color:
        #0b3d4a;
    font-size:
        16px;
    font-weight:
        bold;
}

.historial-fecha {
    color:
        #607d8b;
    font-size:
        13px;
    font-weight:
        bold;
}

.historial-datos {
    display:
        grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap:
        10px;
}

.historial-dato {
    background:
        white;
    padding:
        10px;
    border-radius:
        8px;
}

.historial-dato strong {
    display:
        block;
    font-size:
        11px;
    color:
        #607d8b;
    margin-bottom:
        4px;
}

.historial-dato span {
    font-size:
        14px;
    font-weight:
        600;
}

.historial-ver {
    margin-top:
        13px;
    text-align:
        right;
    color:
        #126579;
    font-size:
        13px;
    font-weight:
        bold;
}

.cargando {
    text-align:
        center;
    padding:
        30px;
    color:
        #607d8b;
}

.error {
    background:
        #ffebee;
    color:
        #b71c1c;
    padding:
        20px;
    border-radius:
        12px;
    text-align:
        center;
    font-weight:
        bold;
}

/* =====================================================
   IMPRESIÓN
===================================================== */

@media print {

    @page {
        size:
            Letter;
        margin:
            10mm 11mm;
    }

    * {
        -webkit-print-color-adjust:
            exact !important;
        print-color-adjust:
            exact !important;
    }

    body {
        background:
            white !important;
        color:
            #263238;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        font-size:
            10px;
    }

    header {
        background:
            #0b3d4a !important;
        box-shadow:
            none !important;
        padding:
            9px 12px;
        margin:
            0 0 10px;
    }

    .header-content {
        max-width:
            100%;
        gap:
            10px;
    }

    .logo {
        width:
            42px;
        height:
            42px;
        padding:
            3px;
        border-radius:
            7px;
    }

    .header-text h1 {
        font-size:
            15px;
    }

    .header-text p {
        font-size:
            9px;
        margin-top:
            2px;
    }

    .contenedor {
        max-width:
            100%;
        margin:
            0;
        padding:
            0;
    }

    .imprimir-btn,
    .mantenimiento-btn,
    .falla-btn {
        display:
            none !important;
    }

    .titulo-equipo {
        position:
            relative;
        display:
            grid;
        grid-template-columns:
            minmax(0, 1fr) 260px;
        column-gap:
            18px;
        align-items:
            start;
        box-shadow:
            none !important;
        border:
            1px solid #d5e0e4;
        border-radius:
            9px;
        padding:
            12px;
        margin-bottom:
            10px;
        min-height:
            150px;
        break-inside:
            avoid;
        page-break-inside:
            avoid;
    }

    .titulo-equipo h2 {
        font-size:
            20px;
        line-height:
            1.2;
        margin:
            2px 0 5px;
    }

    .activo {
        font-size:
            10px;
    }

    .criticidad-falla {
        margin-top:
            7px;
        gap:
            6px;
    }

    .criticidad {
        margin-top:
            0;
        padding:
            4px 9px;
        font-size:
            9px;
        border-width:
            1.5px;
    }

    .foto-contenedor {
        grid-column:
            2;
        grid-row:
            1 / span 3;
        width:
            100%;
        height:
            145px;
        margin:
            0;
        padding:
            5px;
        border-radius:
            8px;
        box-shadow:
            none !important;
        display:
            flex;
        align-items:
            center;
        justify-content:
            center;
        break-inside:
            avoid;
        page-break-inside:
            avoid;
    }

    .foto-equipo {
        width:
            100%;
        height:
            135px;
        max-height:
            135px;
        object-fit:
            contain;
        border-radius:
            5px;
    }

    .seccion {
        box-shadow:
            none !important;
        border:
            1px solid #d5e0e4;
        border-radius:
            8px;
        padding:
            11px;
        margin-bottom:
            9px;
        break-inside:
            auto;
        page-break-inside:
            auto;
    }

    .seccion h3 {
        font-size:
            12px;
        margin:
            0 0 7px;
        padding-bottom:
            5px;
        border-bottom-width:
            1px;
    }

    .grid-info {
        grid-template-columns:
            repeat(2, 1fr);
        gap:
            5px;
    }

    .dato {
        padding:
            6px 7px;
        border-left-width:
            3px;
        border-radius:
            4px;
        min-height:
            38px;
        break-inside:
            avoid;
        page-break-inside:
            avoid;
    }

    .dato strong {
        font-size:
            8px;
        margin-bottom:
            2px;
    }

    .dato span {

<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );

const equipoId =
    parametros.get("equipoId");


function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "No especificado";
    }

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function formatearFecha(valor) {

    if (!valor) {
        return "No especificado";
    }

    const partes =
        String(valor).split("-");

    if (
        partes.length === 3
    ) {

        return `${partes[2]}/${partes[1]}/${partes[0]}`;

    }

    return escaparHTML(valor);

}


function mostrarError(mensaje) {

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="error">

            ❌ ${escaparHTML(mensaje)}

        </div>

    `;

}


if (!equipoId) {

    mostrarError(
        "No se encontró el identificador del equipo. La URL debe contener ?equipoId=..."
    );

} else {

    cargarEquipo();

}


async function cargarEquipo() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}`
            );

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo obtener la información del equipo."
            );

        }

        const datos =
            await respuesta.json();

        if (
            !datos ||
            !datos.id
        ) {

            throw new Error(
                "No se encontró el equipo."
            );

        }

        mostrarEquipo(datos);

        cargarCantidadAccesorios();

        cargarCantidadRepuestos();

        cargarMantenimiento(
            datos.fechaProximoMantenimiento,
            datos.fechaUltimoMantenimiento
        );

    } catch (error) {

        console.error(
            "Error cargando equipo:",
            error
        );

        mostrarError(
            error.message ||
            "No se pudo cargar la ficha técnica."
        );

    }

}


function obtenerFoto(datos) {

    if (!datos.fotografia) {
        return "";
    }

    if (
        Array.isArray(
            datos.fotografia
        )
    ) {

        if (
            datos.fotografia.length === 0
        ) {
            return "";
        }

        return (
            datos.fotografia[0].url ||
            ""
        );

    }

    if (
        typeof datos.fotografia === "string"
    ) {

        return datos.fotografia;

    }

    return "";

}


/* =========================================================
   CRITICIDAD
========================================================= */

function obtenerNivelCriticidad(valor) {

    const criticidad =
        String(valor || "")
            .trim()
            .toLowerCase();

    if (
        criticidad.includes("alta") ||
        criticidad.includes("alto") ||
        criticidad.includes("rojo")
    ) {
        return "alta";
    }

    if (
        criticidad.includes("media") ||
        criticidad.includes("medio") ||
        criticidad.includes("amarillo")
    ) {
        return "media";
    }

    if (
        criticidad.includes("baja") ||
        criticidad.includes("bajo") ||
        criticidad.includes("verde")
    ) {
        return "baja";
    }

    return "otra";

}


function obtenerTextoCriticidad(valor) {

    const nivel =
        obtenerNivelCriticidad(
            valor
        );

    if (nivel === "alta") {
        return "CRITICIDAD ALTA";
    }

    if (nivel === "media") {
        return "CRITICIDAD MEDIA";
    }

    if (nivel === "baja") {
        return "CRITICIDAD BAJA";
    }

    return String(
        valor ||
        "CRITICIDAD NO ESPECIFICADA"
    ).toUpperCase();

}


/* =========================================================
   AYUDA VISUAL
========================================================= */

function obtenerVideosValidos(datos) {

    if (
        !Array.isArray(
            datos.videos
        )
    ) {
        return [];
    }

    return datos.videos.filter(
        video => {

            return (
                video &&
                video.titulo &&
                String(
                    video.titulo
                ).trim() &&
                video.url &&
                String(
                    video.url
                ).trim()
            );

        }
    );

}


function esUrlYouTube(url) {

    try {

        const direccion =
            new URL(url);

        const dominio =
            direccion.hostname
                .toLowerCase()
                .replace(
                    "www.",
                    ""
                );

        return (
            dominio === "youtube.com" ||
            dominio === "youtu.be" ||
            dominio === "m.youtube.com"
        );

    } catch (error) {

        return false;

    }

}


function abrirVideo(url) {

    if (!url) {
        return;
    }

    if (
        !esUrlYouTube(url)
    ) {

        alert(
            "La dirección del video no parece ser una URL válida de YouTube."
        );

        return;

    }

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


function generarAyudaVisual(datos) {

    const videos =
        obtenerVideosValidos(
            datos
        );

    if (
        videos.length === 0
    ) {
        return "";
    }

    const tarjetas =
        videos
            .map(
                (video) => {

                    return `

                        <button
                            type="button"
                            class="video-card"
                            onclick="abrirVideo('${escaparAtributoJS(video.url)}')"
                        >

                            <div class="video-icono">
                                ▶️
                            </div>

                            <div class="video-info">

                                <strong>
                                    ${escaparHTML(
                                        video.titulo
                                    )}
                                </strong>

                                <span>
                                    Ver ayuda visual en YouTube
                                </span>

                            </div>

                            <div class="video-flecha">
                                →
                            </div>

                        </button>

                    `;

                }
            )
            .join("");

    return `

        <section class="seccion ayuda-visual">

            <h3>
                🆘 Ayuda visual
            </h3>

            <p class="ayuda-descripcion">
                Selecciona el problema o situación que presenta el equipo para consultar una ayuda visual.
            </p>

            <div class="videos-grid">

                ${tarjetas}

            </div>

        </section>

    `;

}


function escaparAtributoJS(valor) {

    return String(valor || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /\r/g,
            ""
        )
        .replace(
            /\n/g,
            "\\n"
        );

}


/* =========================================================
   ALERTA DE MANTENIMIENTO
========================================================= */

function generarAlertaMantenimiento(fecha) {

    if (!fecha) {

        return `

            <div class="alerta-mantenimiento amarillo">

                <strong>
                    ⚠️ Mantenimiento sin programar
                </strong>

                <span>
                    No hay una fecha de próximo mantenimiento registrada para este equipo.
                </span>

            </div>

        `;

    }

    const hoy =
        new Date();

    hoy.setHours(
        0,
        0,
        0,
        0
    );

    const fechaMantenimiento =
        new Date(
            String(fecha) +
            "T00:00:00"
        );

    fechaMantenimiento.setHours(
        0,
        0,
        0,
        0
    );

    const diferencia =
        fechaMantenimiento.getTime() -
        hoy.getTime();

    const dias =
        Math.round(
            diferencia /
            (
                1000 *
                60 *
                60 *
                24
            )
        );

    if (dias < 0) {

        const diasVencido =
            Math.abs(dias);

        return `

            <div class="alerta-mantenimiento rojo">

                <strong>
                    🔴 Mantenimiento vencido
                </strong>

                <span>
                    El mantenimiento debió realizarse el
                    ${formatearFecha(fecha)}
                    y presenta un atraso de
                    ${diasVencido}
                    día${diasVencido === 1 ? "" : "s"}.
                </span>

            </div>

        `;

    }

    if (dias === 0) {

        return `

            <div class="alerta-mantenimiento rojo">

                <strong>
                    🔴 Mantenimiento programado para HOY
                </strong>

                <span>
                    Fecha programada:
                    ${formatearFecha(fecha)}
                </span>

            </div>

        `;

    }

    if (dias <= 7) {

        return `

            <div class="alerta-mantenimiento naranja">

                <strong>
                    🟠 Mantenimiento próximo
                </strong>

                <span>
                    Faltan
                    ${dias}
                    día${dias === 1 ? "" : "s"}
                    para el mantenimiento.
                    Fecha:
                    ${formatearFecha(fecha)}
                </span>

            </div>

        `;

    }

    if (dias <= 30) {

        return `

            <div class="alerta-mantenimiento amarillo">

                <strong>
                    🟡 Mantenimiento próximo
                </strong>

                <span>
                    Faltan
                    ${dias}
                    días para el mantenimiento.
                    Fecha:
                    ${formatearFecha(fecha)}
                </span>

            </div>

        `;

    }

    return `

        <div class="alerta-mantenimiento verde">

            <strong>
                🟢 Mantenimiento al corriente
            </strong>

            <span>
                Próximo mantenimiento:
                ${formatearFecha(fecha)}
            </span>

        </div>

    `;

}


/* =========================================================
   MOSTRAR EQUIPO
========================================================= */

            ${

        </section>


        <section class="seccion">

            </h3>

            <div class="grid-info">


                <div class="dato">

                    <strong>
                        Servicio / Área
                    </strong>

                    <span>
                        ${escaparHTML(

                    <span>

                            datos.ubicacion
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Responsable
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.responsable

                    </span>

                <div class="dato">

                <div class="dato">

                <div class="dato">

async function cargarCantidadAccesorios() {

    const elemento =
        document.getElementById(
            "cantidad-accesorios"
        );

    if (!elemento) {
        return;
    }

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(
                    equipoId
                )}/accesorios`
            );

        const datos =
            await respuesta.json();

        if (
            datos.correcto &&
            Array.isArray(
                datos.accesorios
            )
        ) {

            const cantidad =
                datos.accesorios.length;

            elemento.textContent =
                cantidad === 1
                ?
                "1 accesorio disponible · Ver accesorios →"
                :
                `${cantidad} accesorios disponibles · Ver accesorios →`;

        } else {

            elemento.textContent =
                "Ver accesorios del equipo →";

        }

    } catch (error) {

        console.error(error);

        elemento.textContent =
            "Ver accesorios del equipo →";

    }

}

/* =========================================================
   MANTENIMIENTO
========================================================= */

async function cargarMantenimiento(
    fechaProximoEquipo,
    fechaUltimoEquipo
) {

    try {

        const contenedor =
            document.getElementById(
                "mantenimiento-info"
            );

        const historial =
            document.getElementById(
                "historial"
            );


        const alertaMantenimiento =
            generarAlertaMantenimiento(
                fechaProximoEquipo
            );


        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(
                    equipoId
                )}/mantenimientos`
            );


        const datos =
            await respuesta.json();


        if (
            !datos.correcto ||
            !Array.isArray(
                datos.mantenimientos
            )
        ) {

            contenedor.innerHTML = `

                ${alertaMantenimiento}

                <div class="grid-info">

                    <div class="dato">

                        <strong>
                            Último mantenimiento
                        </strong>

                        <span>
                            ${formatearFecha(
                                fechaUltimoEquipo
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Próximo mantenimiento
                        </strong>

                        <span>
                            ${formatearFecha(
                                fechaProximoEquipo
                            )}
                        </span>

                    </div>

                </div>

            `;


            historial.innerHTML = `

                <p>
                    No hay historial de mantenimiento.
                </p>

            `;

            return;

        }


        const mantenimientos =
            datos.mantenimientos;


        if (
            mantenimientos.length === 0
        ) {

            contenedor.innerHTML = `

                ${alertaMantenimiento}

                <div class="grid-info">

                    <div class="dato">

                        <strong>
                            Último mantenimiento
                        </strong>

                        <span>
                            ${formatearFecha(
                                fechaUltimoEquipo
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Próximo mantenimiento
                        </strong>

                        <span>
                            ${formatearFecha(
                                fechaProximoEquipo
                            )}
                        </span>

                    </div>

                </div>

            `;


            historial.innerHTML = `

                <p>
                    No existe historial de mantenimiento.
                </p>

            `;

            return;

        }


        const ultimo =
            mantenimientos[0];


        contenedor.innerHTML = `

            ${alertaMantenimiento}


            <div class="grid-info">


                <div class="dato">

                    <strong>
                        Último mantenimiento
                    </strong>

                    <span>
                        ${formatearFecha(
                            fechaUltimoEquipo ||
                            ultimo.fechaMantenimiento
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Tipo de mantenimiento
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.tipoMantenimiento
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Técnico responsable
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.tecnico
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Próximo mantenimiento
                    </strong>

                    <span>
                        ${formatearFecha(
                            fechaProximoEquipo ||
                            ultimo.proximoMantenimiento
                        )}
                    </span>

                </div>


            </div>

        `;


        historial.innerHTML =
            mantenimientos
                .map(
                    (
                        mantenimiento,
                        indice
                    ) => {

                        return `

                            <a
                                class="historial-item"
                                href="/ficha-mantenimiento.html?mantenimientoId=${encodeURIComponent(
                                    mantenimiento.id
                                )}&equipoId=${encodeURIComponent(
                                    equipoId
                                )}"
                            >

                                <div class="historial-superior">

                                    <div class="historial-titulo">

                                        🛠️ Mantenimiento #${
                                            indice + 1
                                        }

                                    </div>

                                    <div class="historial-fecha">

                                        📅 ${
                                            formatearFecha(
                                                mantenimiento.fechaMantenimiento
                                            )
                                        }

                                    </div>

                                </div>


                                <div class="historial-datos">


                                    <div class="historial-dato">

                                        <strong>
                                            Tipo
                                        </strong>

                                        <span>
                                            ${escaparHTML(
                                                mantenimiento.tipoMantenimiento
                                            )}
                                        </span>

                                    </div>


                                    <div class="historial-dato">

                                        <strong>
                                            Técnico
                                        </strong>

                                        <span>
                                            ${escaparHTML(
                                                mantenimiento.tecnico
                                            )}
                                        </span>

                                    </div>


                                    <div class="historial-dato">

                                        <strong>
                                            Estado
                                        </strong>

                                        <span>
                                            ${escaparHTML(
                                                mantenimiento.estado
                                            )}
                                        </span>

                                    </div>


                                </div>


                                <div class="historial-ver">

                                    Ver ficha completa →

                                </div>


                            </a>

                        `;

                    }
                )
                .join("");


    } catch (error) {

        console.error(
            "Error cargando mantenimiento:",
            error
        );


        const mantenimiento =
            document.getElementById(
                "mantenimiento-info"
            );

        const historial =
            document.getElementById(
                "historial"
            );


        if (mantenimiento) {

            mantenimiento.innerHTML = `

                ${generarAlertaMantenimiento(
                    fechaProximoEquipo
                )}

                <p>
                    No se pudo cargar el historial de mantenimiento.
                </p>

            `;

        }


        if (historial) {

            historial.innerHTML = `

                <p>
                    No se pudo cargar el historial.
                </p>

            `;

        }

    }

}


/* =========================================================
   REPORTAR FALLA / ALARMA
========================================================= */

function abrirFormularioFalla() {

    const modal =
        document.getElementById(
            "falla-modal"
        );

    const mensaje =
        document.getElementById(
            "falla-mensaje"
        );

    const formulario =
        document.getElementById(
            "formulario-falla"
        );

    const nombreEquipo =
        document.getElementById(
            "falla-equipo-nombre"
        );

    const activoEquipo =
        document.getElementById(
            "falla-equipo-activo"
        );


    if (!modal) {
        return;
    }


    mensaje.className =
        "falla-mensaje";

    mensaje.textContent =
        "";


    if (formulario) {
        formulario.reset();
    }


    fetch(
        `/api/equipo/${encodeURIComponent(equipoId)}`
    )
        .then(
            respuesta => {

                if (!respuesta.ok) {
                    throw new Error(
                        "No se pudo cargar el equipo."
                    );
                }

                return respuesta.json();

            }
        )
        .then(
            datos => {

                if (nombreEquipo) {

                    nombreEquipo.textContent =
                        datos.nombre ||
                        "No especificado";

                }

                if (activoEquipo) {

                    activoEquipo.textContent =
                        `Activo fijo: ${
                            datos.numeroActivo ||
                            "No especificado"
                        }`;

                }

            }
        )
        .catch(
            error => {

                console.error(
                    "Error cargando información del equipo:",
                    error
                );

                if (nombreEquipo) {

                    nombreEquipo.textContent =
                        "No se pudo cargar el nombre del equipo.";

                }

                if (activoEquipo) {

                    activoEquipo.textContent =
                        "Activo fijo: No disponible";

                }

            }
        );


    modal.classList.add(
        "activo"
    );


    document.body.style.overflow =
        "hidden";

}


function cerrarFormularioFalla() {

    const modal =
        document.getElementById(
            "falla-modal"
        );

    if (!modal) {
        return;
    }

    modal.classList.remove(
        "activo"
    );

    document.body.style.overflow =
        "";

}


function cerrarFallaDesdeFondo(event) {

    if (
        event.target &&
        event.target.id ===
            "falla-modal"
    ) {

        cerrarFormularioFalla();

    }

}


async function registrarFalla(event) {

    event.preventDefault();


    const formulario =
        document.getElementById(
            "formulario-falla"
        );

    const boton =
        document.getElementById(
            "falla-guardar"
        );

    const mensaje =
        document.getElementById(
            "falla-mensaje"
        );


    if (!formulario || !boton || !mensaje) {
        return;
    }


    const tipoFalla =
        document.getElementById(
            "tipo-falla"
        ).value.trim();


    const descripcionFalla =
        document.getElementById(
            "descripcion-falla"
        ).value.trim();


    if (!tipoFalla) {

        mostrarMensajeFalla(
            "Selecciona el tipo de falla.",
            true
        );

        return;

    }


    if (!descripcionFalla) {

        mostrarMensajeFalla(
            "Escribe una descripción de la falla.",
            true
        );

        return;

    }


    const datosFormulario =
        new FormData(
            formulario
        );


    datosFormulario.append(
        "equipoId",
        equipoId
    );


    boton.disabled =
        true;

    boton.textContent =
        "⏳ Registrando...";


    mensaje.className =
        "falla-mensaje";

    mensaje.textContent =
        "";


    try {

        const respuesta =
            await fetch(
                "/api/falla",
                {
                    method:
                        "POST",
                    body:
                        datosFormulario
                }
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok || !datos.correcto) {

            throw new Error(
                datos.mensaje ||
                "No se pudo registrar la falla."
            );

        }


        mostrarMensajeFalla(
            datos.mensaje ||
            "Falla registrada correctamente.",
            false
        );


        setTimeout(
            () => {

                cerrarFormularioFalla();

            },
            1200
        );


    } catch (error) {

        console.error(
            "Error registrando falla:",
            error
        );


        mostrarMensajeFalla(
            error.message ||
            "No se pudo registrar la falla.",
            true
        );


        boton.disabled =
            false;

        boton.textContent =
            "🔴 Registrar falla";

    }

}


function mostrarMensajeFalla(
    texto,
    esError
) {

    const mensaje =
        document.getElementById(
            "falla-mensaje"
        );

    if (!mensaje) {
        return;
    }


    mensaje.textContent =
        texto;


    mensaje.className =
        esError
        ?
        "falla-mensaje error"
        :
        "falla-mensaje exito";

}


/*
 * Activar el formulario cuando la página
 * ya está cargada.
 */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const formulario =
            document.getElementById(
                "formulario-falla"
            );

        if (formulario) {

            formulario.addEventListener(
                "submit",
                registrarFalla
            );

        }

    }
);

/* =========================================================
   ACCESO A MANTENIMIENTO
========================================================= */

function accederMantenimiento() {

    const password =
        prompt(
            "Ingresa la contraseña del Área de Ingeniería Biomédica:"
        );


    if (!password) {
        return;
    }


    sessionStorage.setItem(
        "mantenimientoPassword",
        password
    );


    window.location.href =
        `/mantenimiento.html?equipoId=${encodeURIComponent(
            equipoId
        )}`;

}
