<body>


<header>

    <div class="header-content">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo institucional"
        >

        <div class="header-text">

            <h1>
                ÁREA DE INGENIERÍA BIOMÉDICA
            </h1>

            <p>
                GESTIÓN DE EQUIPO BIOMÉDICO
            </p>

        </div>

    </div>

</header>


<main class="contenedor">

    <div id="contenido">

        <div class="cargando">
            Cargando ficha técnica...
        </div>

    </div>

</main>


<script>


const parametros =
    new URLSearchParams(
        window.location.search
    );


const equipoId =
    parametros.get(
        "equipoId"
    );


function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "No especificado";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function formatearFecha(valor) {

    if (!valor) {
        return "No especificado";
    }


    const partes =
        String(valor).split("-");


    if (
        partes.length === 3
    ) {

        return `${partes[2]}/${partes[1]}/${partes[0]}`;

    }


    return escaparHTML(valor);

}


function mostrarError(mensaje) {

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="error">

            ❌
            ${escaparHTML(mensaje)}

        </div>

    `;

}


if (!equipoId) {

    mostrarError(
        "No se encontró el identificador del equipo. La URL debe contener ?equipoId=..."
    );

} else {

    cargarEquipo();

}


async function cargarEquipo() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}`
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo obtener la información del equipo."
            );

        }


        const datos =
            await respuesta.json();


        if (
            !datos ||
            !datos.id
        ) {

            throw new Error(
                "No se encontró el equipo."
            );

        }


        mostrarEquipo(
            datos
        );


        cargarCantidadAccesorios();

        cargarCantidadRepuestos();

        cargarMantenimiento();


    } catch (error) {

        console.error(
            "Error cargando equipo:",
            error
        );


        mostrarError(
            error.message ||
            "No se pudo cargar la ficha técnica."
        );

    }

}


function obtenerFoto(datos) {

    if (
        !datos.fotografia
    ) {

        return "";

    }


    if (
        Array.isArray(
            datos.fotografia
        )
    ) {

        if (
            datos.fotografia.length === 0
        ) {

            return "";

        }


        return (
            datos.fotografia[0].url ||
            ""
        );

    }


    if (
        typeof datos.fotografia === "string"
    ) {

        return datos.fotografia;

    }


    return "";

}


/* =========================================================
   AYUDA VISUAL
========================================================= */

function obtenerVideosValidos(datos) {

    if (
        !Array.isArray(datos.videos)
    ) {

        return [];

    }


    return datos.videos.filter(video => {

        return (
            video &&
            video.titulo &&
            String(video.titulo).trim() &&
            video.url &&
            String(video.url).trim()
        );

    });

}


function esUrlYouTube(url) {

    try {

        const direccion =
            new URL(url);

        const dominio =
            direccion.hostname
                .toLowerCase()
                .replace(
                    "www.",
                    ""
                );

        return (
            dominio === "youtube.com" ||
            dominio === "youtu.be" ||
            dominio === "m.youtube.com"
        );

    } catch (error) {

        return false;

    }

}


function abrirVideo(url) {

    if (!url) {
        return;
    }


    if (!esUrlYouTube(url)) {

        alert(
            "La dirección del video no parece ser una URL válida de YouTube."
        );

        return;

    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


function generarAyudaVisual(datos) {

    const videos =
        obtenerVideosValidos(
            datos
        );


    if (
        videos.length === 0
    ) {

        return "";

    }


    const tarjetas =
        videos
            .map(
                (video, indice) => {

                    return `

                        <button
                            type="button"
                            class="video-card"
                            onclick="abrirVideo('${escaparAtributoJS(video.url)}')"
                        >

                            <div class="video-icono">
                                ▶️
                            </div>


                            <div class="video-info">

                                <strong>
                                    ${escaparHTML(
                                        video.titulo
                                    )}
                                </strong>

                                <span>
                                    Ver ayuda visual en YouTube
                                </span>

                            </div>


                            <div class="video-flecha">
                                →
                            </div>

                        </button>

                    `;

                }
            )
            .join("");


    return `

        <section class="seccion ayuda-visual">

            <h3>
                🆘 Ayuda visual
            </h3>


            <p class="ayuda-descripcion">

                Selecciona el problema o situación que presenta
                el equipo para consultar una ayuda visual.

            </p>


            <div class="videos-grid">

                ${tarjetas}

            </div>

        </section>

    `;

}


function escaparAtributoJS(valor) {

    return String(valor || "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /\r/g,
            ""
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


function mostrarEquipo(datos) {

    const fotografia =
        obtenerFoto(datos);


    const ayudaVisual =
        generarAyudaVisual(
            datos
        );


    document.getElementById(
        "contenido"
    ).innerHTML = `


        <section class="titulo-equipo">

            <h2>

                ${escaparHTML(
                    datos.nombre
                )}

            </h2>


            <div class="activo">

                Número de activo fijo:

                ${escaparHTML(
                    datos.numeroActivo
                )}

            </div>


            <div class="criticidad">

                ${escaparHTML(
                    datos.criticidad ||
                    "Sin especificar"
                )}

            </div>


            ${
                fotografia
                ?

                `<img
                    src="${escaparHTML(
                        fotografia
                    )}"
                    class="foto-equipo"
                    alt="Fotografía del equipo"
                >`

                :

                ""
            }


        </section>


        <section class="seccion">

            <h3>
                📋 Información del Equipo
            </h3>


            <div class="grid-info">


                <div class="dato">

                    <strong>
                        Servicio / Área
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.servicio
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Nombre del equipo
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.nombre
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Marca
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.marca
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Modelo
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.modelo
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Número de serie
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.serie
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Ubicación
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.ubicacion
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Responsable
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.responsable
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Estado del equipo
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.estado
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Garantía
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.garantia
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Condición física
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.condicionFisica
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Fecha de adquisición
                    </strong>

                    <span>
                        ${formatearFecha(
                            datos.fechaAdquisicion
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Proveedor
                    </strong>

                    <span>
                        ${escaparHTML(
                            datos.proveedor
                        )}
                    </span>

                </div>


            </div>

        </section>


        ${ayudaVisual}


        <section class="seccion">

            <h3>
                🔌 Accesorios Médicos
            </h3>


            <a
                class="acceso-card"
                href="/accesorio.html?equipoId=${encodeURIComponent(
                    equipoId
                )}"
            >

                <div class="acceso-izq">

                    <div class="acceso-icono">
                        🔌
                    </div>


                    <div class="acceso-info">

                        <strong>
                            Accesorios del equipo
                        </strong>

                        <span id="cantidad-accesorios">
                            Consultando accesorios...
                        </span>

                    </div>

                </div>


                <div class="flecha">
                    →
                </div>

            </a>

        </section>


        <section class="seccion">

            <h3>
                🔧 Repuestos Médicos
            </h3>


            <a
                class="acceso-card"
                href="/repuesto.html?equipoId=${encodeURIComponent(
                    equipoId
                )}"
            >

                <div class="acceso-izq">

                    <div class="acceso-icono">
                        🔧
                    </div>


                    <div class="acceso-info">

                        <strong>
                            Repuestos del equipo
                        </strong>

                        <span id="cantidad-repuestos">
                            Consultando repuestos...
                        </span>

                    </div>

                </div>


                <div class="flecha">
                    →
                </div>

            </a>

        </section>


        <section class="seccion">

            <h3>
                🛠️ Información de Mantenimiento
            </h3>


            <div id="mantenimiento-info">

                <div class="cargando">
                    Cargando información...
                </div>

            </div>

        </section>


        <section class="seccion">

            <h3>
                📋 Historial de Mantenimiento
            </h3>


            <div id="historial">

                <div class="cargando">
                    Cargando historial...
                </div>

            </div>

        </section>


        <section class="seccion">

            <button
                class="mantenimiento-btn"
                onclick="accederMantenimiento()"
            >

                🔧
                Acceder a Mantenimiento

            </button>

        </section>


    `;

}


async function cargarCantidadAccesorios() {

    const elemento =
        document.getElementById(
            "cantidad-accesorios"
        );


    if (!elemento) {
        return;
    }


    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(
                    equipoId
                )}/accesorios`
            );


        const datos =
            await respuesta.json();


        if (
            datos.correcto &&
            Array.isArray(
                datos.accesorios
            )
        ) {

            const cantidad =
                datos.accesorios.length;


            elemento.textContent =

                cantidad === 1

                ?

                "1 accesorio disponible · Ver accesorios →"

                :

                `${cantidad} accesorios disponibles · Ver accesorios →`;

        } else {

            elemento.textContent =
                "Ver accesorios del equipo →";

        }


    } catch (error) {

        console.error(error);

        elemento.textContent =
            "Ver accesorios del equipo →";

    }

}

async function cargarMantenimiento() {

    try {

        const respuesta =
            await fetch(
                `/api/equipo/${encodeURIComponent(
                    equipoId
                )}/mantenimientos`
            );


        const datos =
            await respuesta.json();


        const contenedor =
            document.getElementById(
                "mantenimiento-info"
            );


        const historial =
            document.getElementById(
                "historial"
            );


        if (
            !datos.correcto ||
            !Array.isArray(
                datos.mantenimientos
            )
        ) {

            contenedor.innerHTML =
                `<p>No hay información de mantenimiento.</p>`;


            historial.innerHTML =
                `<p>No hay historial de mantenimiento.</p>`;


            return;

        }


        const mantenimientos =
            datos.mantenimientos;


        if (
            mantenimientos.length === 0
        ) {

            contenedor.innerHTML = `

                <p>
                    No se han registrado mantenimientos
                    para este equipo.
                </p>

            `;


            historial.innerHTML = `

                <p>
                    No existe historial de mantenimiento.
                </p>

            `;


            return;

        }


        const ultimo =
            mantenimientos[0];


        contenedor.innerHTML = `

            <div class="grid-info">


                <div class="dato">

                    <strong>
                        Último mantenimiento
                    </strong>

                    <span>
                        ${formatearFecha(
                            ultimo.fechaMantenimiento
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Tipo de mantenimiento
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.tipoMantenimiento
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Técnico responsable
                    </strong>

                    <span>
                        ${escaparHTML(
                            ultimo.tecnico
                        )}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Próximo mantenimiento
                    </strong>

                    <span>
                        ${formatearFecha(
                            ultimo.proximoMantenimiento
                        )}
                    </span>

                </div>


            </div>

        `;


        historial.innerHTML =

            mantenimientos

                .map(
                    (mantenimiento, indice) => {

                        return `

                            <a
                                class="historial-item"
                                href="/ficha-mantenimiento.html?mantenimientoId=${encodeURIComponent(
                                    mantenimiento.id
                                )}&equipoId=${encodeURIComponent(
                                    equipoId
                                )}"
                            >

                                <div class="historial-superior">

                                    <div class="historial-titulo">

                                        🛠️
                                        Mantenimiento #${
                                            indice + 1
                                        }

                                    </div>


                                    <div class="historial-fecha">

                                        📅
                                        ${
                                            formatearFecha(
                                                mantenimiento.fechaMantenimiento
                                            )
                                        }

                                    </div>

                                </div>


                                <div class="historial-datos">


                                    <div class="historial-dato">

                                        <strong>
                                            Tipo
                                        </strong>

                                        <span>
                                            ${
                                                escaparHTML(
                                                    mantenimiento.tipoMantenimiento
                                                )
                                            }
                                        </span>

                                    </div>


                                    <div class="historial-dato">

                                        <strong>
                                            Técnico
                                        </strong>

                                        <span>
                                            ${
                                                escaparHTML(
                                                    mantenimiento.tecnico
                                                )
                                            }
                                        </span>

                                    </div>


                                    <div class="historial-dato">

                                        <strong>
                                            Estado
                                        </strong>

                                        <span>
                                            ${
                                                escaparHTML(
                                                    mantenimiento.estado
                                                )
                                            }
                                        </span>

                                    </div>


                                </div>


                                <div class="historial-ver">

                                    Ver ficha completa
                                    →

                                </div>


                            </a>

                        `;

                    }
                )

                .join("");


    } catch (error) {

        console.error(
            "Error cargando mantenimiento:",
            error
        );


        const mantenimiento =
            document.getElementById(
                "mantenimiento-info"
            );


        const historial =
            document.getElementById(
                "historial"
            );


        if (mantenimiento) {

            mantenimiento.innerHTML =
                `<p>No se pudo cargar mantenimiento.</p>`;

        }


        if (historial) {

            historial.innerHTML =
                `<p>No se pudo cargar el historial.</p>`;

        }

    }

}


function accederMantenimiento() {

    const password =
        prompt(
            "Ingresa la contraseña del Área de Ingeniería Biomédica:"
        );


    if (!password) {
        return;
    }


    sessionStorage.setItem(
        "mantenimientoPassword",
        password
    );


    window.location.href =
        `/mantenimiento.html?equipoId=${encodeURIComponent(
            equipoId
        )}`;

}
