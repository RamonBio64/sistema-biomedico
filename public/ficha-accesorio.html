<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha Técnica | Accesorio Biomédico</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f8;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #0b3d4a, #126579);
            color: white;
            padding: 18px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.15);
        }

        .header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 5px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitulo {
            margin-top: 5px;
            opacity: .9;
            font-size: 14px;
        }

        main {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* ==============================
           ACCIONES
           ============================== */

        .acciones {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .volver {
            display: inline-block;
            color: #126579;
            font-weight: bold;
            text-decoration: none;
        }

        .boton-imprimir {
            border: none;
            background: #0b3d4a;
            color: white;
            padding: 11px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s ease;
        }

        .boton-imprimir:hover {
            background: #126579;
            transform: translateY(-1px);
        }


        /* ==============================
           TÍTULO
           ============================== */

        .titulo {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .titulo h2 {
            margin: 0 0 8px;
            color: #0b3d4a;
            font-size: 28px;
        }

        .activo {
            color: #607d8b;
            font-weight: bold;
        }


        /* ==============================
           FOTOGRAFÍA
           ============================== */

        .foto {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-top: 20px;
            border-radius: 12px;
            background: #fafafa;
        }

        .sin-foto {
            width: 100%;
            height: 220px;
            margin-top: 20px;
            background: #f3f6f8;
            border: 1px dashed #b8c4c8;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #78909c;
            font-size: 16px;
        }


        /* ==============================
           SECCIONES
           ============================== */

        .seccion {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-bottom: 20px;
        }

        .seccion h3 {
            margin-top: 0;
            color: #0b3d4a;
            border-bottom: 2px solid #e5ecef;
            padding-bottom: 12px;
        }


        /* ==============================
           GRID
           ============================== */

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .dato {
            background: #f7f9fa;
            padding: 14px;
            border-radius: 9px;
            border-left: 4px solid #126579;
        }

        .dato strong {
            display: block;
            color: #607d8b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .dato span {
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }


        /* ==============================
           CARGANDO / ERROR
           ============================== */

        .cargando {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: #607d8b;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }


        /* =========================================================
           IMPRESIÓN PROFESIONAL
           ========================================================= */

        @media print {

            @page {
                size: letter;
                margin: 10mm;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html,
            body {
                width: 100%;
                min-height: 0;
                margin: 0;
                padding: 0;

                background: white !important;

                color: #263238 !important;

                font-family: Arial, Helvetica, sans-serif;
            }


            /* =====================================================
               OCULTAR NAVEGACIÓN
               ===================================================== */

            .acciones {
                display: none !important;
            }


            /* =====================================================
               ENCABEZADO INSTITUCIONAL
               ===================================================== */

            header {
                background: white !important;
                color: #0b3d4a !important;

                padding: 0 0 8px 0 !important;

                margin: 0 0 10px 0;

                border-bottom: 2px solid #0b3d4a;

                box-shadow: none !important;
            }

            .header {
                max-width: none;

                margin: 0;

                display: flex;

                align-items: center;

                gap: 12px;
            }

            .logo {
                width: 50px;
                height: 50px;

                padding: 3px;

                background: white !important;

                border: 1px solid #cbd5d8;

                border-radius: 5px;
            }

            h1 {
                margin: 0;

                font-size: 16pt;

                color: #0b3d4a !important;

                letter-spacing: .3px;
            }

            .subtitulo {
                margin-top: 2px;

                font-size: 9pt;

                color: #607d8b !important;

                opacity: 1;
            }


            /* =====================================================
               CONTENEDOR PRINCIPAL
               ===================================================== */

            main {
                max-width: none;

                width: 100%;

                margin: 0;

                padding: 0;
            }


            /* =====================================================
               TÍTULO DE LA FICHA
               ===================================================== */

            .titulo {
                padding: 9px 12px;

                background: #f1f5f6 !important;

                border: 1px solid #aebbc0;

                border-radius: 0;

                box-shadow: none !important;

                margin: 0 0 10px 0;
            }

            .titulo h2 {
                margin: 0;

                font-size: 15pt;

                color: #0b3d4a !important;
            }

            .activo {
                margin-top: 3px;

                font-size: 8.5pt;

                color: #607d8b !important;
            }


            /* =====================================================
               FOTOGRAFÍA
               ===================================================== */

            .foto {
                display: block;

                width: 100%;

                height: 145px;

                max-height: 145px;

                object-fit: contain;

                object-position: center;

                margin: 0 0 12px 0;

                padding: 5px;

                background: white !important;

                border: 1px solid #cbd5d8;

                border-radius: 5px;

                page-break-inside: avoid;
            }

            .sin-foto {
                width: 100%;

                height: 70px;

                margin: 0 0 12px 0;

                background: white !important;

                border: 1px dashed #b8c4c8;

                border-radius: 5px;

                color: #78909c !important;

                font-size: 9pt;

                page-break-inside: avoid;
            }


            /* =====================================================
               SECCIÓN DE INFORMACIÓN
               ===================================================== */

            .seccion {
                width: 100%;

                background: white !important;

                padding: 0;

                margin: 0;

                border: none;

                border-radius: 0;

                box-shadow: none !important;

                page-break-inside: avoid;
            }

            .seccion h3 {
                margin: 0;

                padding: 8px 10px;

                color: #0b3d4a !important;

                background: #f1f5f6 !important;

                border: 1px solid #aebbc0;

                font-size: 11pt;
            }


            /* =====================================================
               INFORMACIÓN COMO TABLA
               ===================================================== */

            .grid {
                display: grid;

                grid-template-columns: 1fr 1fr;

                gap: 0;

                width: 100%;

                border-left: 1px solid #aebbc0;

                border-top: 1px solid #aebbc0;
            }

            .dato {
                min-height: 58px;

                padding: 8px 10px;

                background: white !important;

                border: none;

                border-right: 1px solid #aebbc0;

                border-bottom: 1px solid #aebbc0;

                border-left: none;

                border-radius: 0;

                page-break-inside: avoid;
            }


            /* =====================================================
               ETIQUETAS
               ===================================================== */

            .dato strong {
                display: block;

                margin-bottom: 4px;

                font-size: 7.5pt;

                color: #607d8b !important;

                text-transform: uppercase;

                font-weight: bold;

                letter-spacing: .2px;
            }


            /* =====================================================
               VALORES
               ===================================================== */

            .dato span {
                display: block;

                font-size: 10pt;

                line-height: 1.3;

                color: #263238 !important;

                word-break: break-word;
            }


            /* =====================================================
               EVITAR CORTES
               ===================================================== */

            .titulo,
            .foto,
            .sin-foto,
            .seccion,
            .grid,
            .dato {
                page-break-inside: avoid;
            }

        }


        /* ==============================
           CELULAR
           ============================== */

        @media(max-width:700px) {

            .acciones {
                flex-direction: column;
                align-items: stretch;
            }

            .boton-imprimir {
                width: 100%;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .titulo h2 {
                font-size: 23px;
            }

            h1 {
                font-size: 18px;
            }

        }

    </style>

</head>

<body>


<header>

    <div class="header">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo institucional"
        >

        <div>

            <h1>
                ÁREA DE INGENIERÍA BIOMÉDICA
            </h1>

            <div class="subtitulo">
                GESTIÓN DE ACCESORIOS MÉDICOS
            </div>

        </div>

    </div>

</header>


<main>


    <div class="acciones">

        <a
            id="volver"
            class="volver"
            href="#"
        >
            ← Volver a accesorios
        </a>


        <button
            type="button"
            class="boton-imprimir"
            onclick="window.print()"
        >
            🖨️ Imprimir ficha
        </button>

    </div>


    <div id="contenido">

        <div class="cargando">
            Cargando ficha del accesorio...
        </div>

    </div>


</main>


<script>


const parametros =
    new URLSearchParams(
        window.location.search
    );


const accesorioId =
    parametros.get("accesorioId");


const equipoId =
    parametros.get("equipoId");



/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "No especificado";

    }


    return String(valor)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* =========================================================
   MOSTRAR ERROR
   ========================================================= */

function mostrarError(mensaje) {

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="error">

            ❌ ${escaparHTML(mensaje)}

        </div>

    `;

}



/* =========================================================
   VALIDAR ID
   ========================================================= */

if (!accesorioId) {

    mostrarError(
        "No se encontró el identificador del accesorio."
    );

} else {


    if (equipoId) {

        document.getElementById(
            "volver"
        ).href =
            `/accesorio.html?equipoId=${encodeURIComponent(equipoId)}`;

    } else {

        document.getElementById(
            "volver"
        ).href =
            "/accesorio.html";

    }


    cargarAccesorio();

}



/* =========================================================
   CARGAR ACCESORIO
   ========================================================= */

async function cargarAccesorio() {

    try {


        const respuesta =
            await fetch(
                `/api/accesorio/${encodeURIComponent(accesorioId)}`
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo obtener la información del accesorio."
            );

        }


        const respuestaJSON =
            await respuesta.json();


        /*
         * server.js devuelve:
         *
         * {
         *     correcto: true,
         *     accesorio: {
         *         id: "...",
         *         nombre: "...",
         *         ...
         *     }
         * }
         */


        if (
            !respuestaJSON ||
            !respuestaJSON.correcto ||
            !respuestaJSON.accesorio ||
            !respuestaJSON.accesorio.id
        ) {

            throw new Error(
                "No se encontró el accesorio."
            );

        }


        const datos =
            respuestaJSON.accesorio;


        mostrarAccesorio(datos);


    } catch (error) {

        console.error(
            "Error cargando accesorio:",
            error
        );


        mostrarError(
            error.message ||
            "No se pudo cargar la ficha del accesorio."
        );

    }

}



/* =========================================================
   OBTENER FOTOGRAFÍA
   ========================================================= */

function obtenerFoto(datos) {

    if (!datos.fotografia) {

        return "";

    }


    if (
        Array.isArray(datos.fotografia)
    ) {

        if (
            datos.fotografia.length === 0
        ) {

            return "";

        }


        return (
            datos.fotografia[0].url ||
            ""
        );

    }


    if (
        typeof datos.fotografia === "string"
    ) {

        return datos.fotografia;

    }


    return "";

}



/* =========================================================
   MOSTRAR ACCESORIO
   ========================================================= */

function mostrarAccesorio(datos) {


    const fotografia =
        obtenerFoto(datos);



    document.getElementById(
        "contenido"
    ).innerHTML = `


        <!-- ==============================================
             TÍTULO
             ============================================== -->


        <section class="titulo">


            <h2>

                ${escaparHTML(
                    datos.nombre
                )}

            </h2>


            <div class="activo">

                Número de activo fijo:

                ${escaparHTML(
                    datos.numeroActivo
                )}

            </div>



            ${
                fotografia

                ?

                `

                <img

                    src="${escaparHTML(
                        fotografia
                    )}"

                    class="foto"

                    alt="Fotografía del accesorio"

                    onerror="
                        this.style.display='none';
                        document.getElementById('sinFoto').style.display='flex';
                    "

                >


                <div
                    id="sinFoto"
                    class="sin-foto"
                    style="display:none;"
                >

                    📷 No se pudo cargar la fotografía.

                </div>

                `

                :

                `

                <div class="sin-foto">

                    📷 Este accesorio no tiene fotografía registrada.

                </div>

                `

            }


        </section>



        <!-- ==============================================
             INFORMACIÓN DEL ACCESORIO
             ============================================== -->


        <section class="seccion">


            <h3>

                📋 Información del Accesorio

            </h3>



            <div class="grid">


                <!-- NOMBRE -->

                <div class="dato">

                    <strong>

                        Nombre del accesorio

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.nombre
                        )}

                    </span>

                </div>



                <!-- ACTIVO FIJO -->

                <div class="dato">

                    <strong>

                        Número de activo fijo

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.numeroActivo
                        )}

                    </span>

                </div>



                <!-- SERIE -->

                <div class="dato">

                    <strong>

                        Número de serie

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.serie
                        )}

                    </span>

                </div>



                <!-- MODELO -->

                <div class="dato">

                    <strong>

                        Modelo

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.modelo
                        )}

                    </span>

                </div>



                <!-- ESTADO -->

                <div class="dato">

                    <strong>

                        Estado del accesorio

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.estado
                        )}

                    </span>

                </div>



                <!-- COLOR -->

                <div class="dato">

                    <strong>

                        Color

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.color
                        )}

                    </span>

                </div>



                <!-- ACTIVO -->

                <div class="dato">

                    <strong>

                        Activo

                    </strong>

                    <span>

                        ${
                            datos.activo
                            ? "Sí"
                            : "No"
                        }

                    </span>

                </div>



                <!-- OBSERVACIONES -->

                <div class="dato">

                    <strong>

                        Observaciones

                    </strong>

                    <span>

                        ${escaparHTML(
                            datos.observaciones
                        )}

                    </span>

                </div>


            </div>


        </section>


    `;

}

</script>


</body>
</html>
