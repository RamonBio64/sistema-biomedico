<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha Técnica | Accesorio Biomédico</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f8;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #0b3d4a, #126579);
            color: white;
            padding: 18px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.15);
        }

        .header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 5px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitulo {
            margin-top: 5px;
            opacity: .9;
            font-size: 14px;
        }

        main {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 15px;
            color: #126579;
            font-weight: bold;
            text-decoration: none;
        }

        .titulo {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .titulo h2 {
            margin: 0 0 8px;
            color: #0b3d4a;
            font-size: 28px;
        }

        .activo {
            color: #607d8b;
            font-weight: bold;
        }

        .foto {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-top: 20px;
            border-radius: 12px;
            background: #fafafa;
        }

        .seccion {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-bottom: 20px;
        }

        .seccion h3 {
            margin-top: 0;
            color: #0b3d4a;
            border-bottom: 2px solid #e5ecef;
            padding-bottom: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .dato {
            background: #f7f9fa;
            padding: 14px;
            border-radius: 9px;
            border-left: 4px solid #126579;
        }

        .dato strong {
            display: block;
            color: #607d8b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .dato span {
            font-size: 15px;
            font-weight: 600;
        }

        .cargando {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: #607d8b;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        @media(max-width:700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .titulo h2 {
                font-size: 23px;
            }

            h1 {
                font-size: 18px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo institucional"
        >

        <div>

            <h1>
                ÁREA DE INGENIERÍA BIOMÉDICA
            </h1>

            <div class="subtitulo">
                GESTIÓN DE ACCESORIOS MÉDICOS
            </div>

        </div>

    </div>

</header>


<main>

    <a
        id="volver"
        class="volver"
        href="#"
    >
        ← Volver a accesorios
    </a>


    <div id="contenido">

        <div class="cargando">
            Cargando ficha del accesorio...
        </div>

    </div>

</main>


<script>

const parametros =
    new URLSearchParams(window.location.search);

const accesorioId =
    parametros.get("accesorioId");

const equipoId =
    parametros.get("equipoId");


function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "No especificado";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function mostrarError(mensaje) {

    document.getElementById("contenido").innerHTML = `
        <div class="error">
            ❌ ${escaparHTML(mensaje)}
        </div>
    `;

}


if (!accesorioId) {

    mostrarError(
        "No se encontró el identificador del accesorio."
    );

} else {

    if (equipoId) {

        document.getElementById("volver").href =
            `/accesorio.html?equipoId=${encodeURIComponent(equipoId)}`;

    } else {

        document.getElementById("volver").href =
            "/accesorio.html";

    }

    cargarAccesorio();

}


async function cargarAccesorio() {

    try {

        const respuesta =
            await fetch(
                `/api/accesorio/${encodeURIComponent(accesorioId)}`
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo obtener la información del accesorio."
            );

        }


        const datos =
            await respuesta.json();


        if (!datos || !datos.id) {

            throw new Error(
                "No se encontró el accesorio."
            );

        }


        mostrarAccesorio(datos);


    } catch (error) {

        console.error(
            "Error cargando accesorio:",
            error
        );

        mostrarError(
            error.message ||
            "No se pudo cargar la ficha del accesorio."
        );

    }

}


function obtenerFoto(datos) {

    if (!datos.fotografia) {
        return "";
    }

    if (Array.isArray(datos.fotografia)) {

        if (datos.fotografia.length === 0) {
            return "";
        }

        return datos.fotografia[0].url || "";

    }

    if (typeof datos.fotografia === "string") {
        return datos.fotografia;
    }

    return "";

}


function mostrarAccesorio(datos) {

    const fotografia =
        obtenerFoto(datos);


    document.getElementById("contenido").innerHTML = `

        <section class="titulo">

            <h2>
                ${escaparHTML(datos.nombre)}
            </h2>

            <div class="activo">
                Número de activo fijo:
                ${escaparHTML(datos.numeroActivo)}
            </div>

            ${
                fotografia
                ?
                `
                <img
                    src="${escaparHTML(fotografia)}"
                    class="foto"
                    alt="Fotografía del accesorio"
                >
                `
                :
                ""
            }

        </section>


        <section class="seccion">

            <h3>
                📋 Información del Accesorio
            </h3>

            <div class="grid">

                <div class="dato">

                    <strong>
                        Nombre del accesorio
                    </strong>

                    <span>
                        ${escaparHTML(datos.nombre)}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Número de activo fijo
                    </strong>

                    <span>
                        ${escaparHTML(datos.numeroActivo)}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Número de serie
                    </strong>

                    <span>
                        ${escaparHTML(datos.serie)}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Modelo
                    </strong>

                    <span>
                        ${escaparHTML(datos.modelo)}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Estado del accesorio
                    </strong>

                    <span>
                        ${escaparHTML(datos.estado)}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Color
                    </strong>

                    <span>
                        ${escaparHTML(datos.color)}
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Activo
                    </strong>

                    <span>
                        ${
                            datos.activo
                            ? "Sí"
                            : "No"
                        }
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Observaciones
                    </strong>

                    <span>
                        ${escaparHTML(datos.observaciones)}
                    </span>

                </div>

            </div>

        </section>

    `;

}

</script>

</body>
</html>
