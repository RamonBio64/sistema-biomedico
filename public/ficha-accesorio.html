    <script>

        // =====================================================
        // OBTENER PARÁMETROS DE LA URL
        // =====================================================

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const accesorioId =
            parametros.get("accesorioId");


        const equipoId =
            parametros.get("equipoId");


        // =====================================================
        // CONFIGURAR BOTÓN VOLVER
        // =====================================================

        const btnVolver =
            document.getElementById("btnVolver");


        if (equipoId) {

            btnVolver.href =
                `/accesorio.html?equipoId=${encodeURIComponent(equipoId)}`;

        } else {

            btnVolver.href =
                "/accesorio.html";

        }


        // =====================================================
        // CARGAR ACCESORIO
        // =====================================================

        async function cargarAccesorio() {

            const ficha =
                document.getElementById("ficha");


            if (!accesorioId) {

                ficha.innerHTML = `

                    <div class="mensaje error">

                        <h2>
                            Accesorio no especificado
                        </h2>

                        <p>
                            Esta ficha requiere el identificador del accesorio.
                        </p>

                    </div>

                `;

                return;

            }


            try {

                const respuesta =
                    await fetch(
                        `/api/accesorio/${encodeURIComponent(accesorioId)}`
                    );


                if (!respuesta.ok) {

                    throw new Error(
                        `Error del servidor (${respuesta.status}).`
                    );

                }


                const datos =
                    await respuesta.json();


                if (!datos.correcto) {

                    throw new Error(
                        datos.error ||
                        "No se pudo obtener la información del accesorio."
                    );

                }


                if (!datos.accesorio) {

                    throw new Error(
                        "El servidor no devolvió la información del accesorio."
                    );

                }


                mostrarAccesorio(
                    datos.accesorio
                );


            } catch (error) {

                console.error(
                    "Error al cargar accesorio:",
                    error
                );


                ficha.innerHTML = `

                    <div class="mensaje error">

                        <h2>
                            Error al cargar el accesorio
                        </h2>

                        <p>
                            ${escapeHTML(
                                error.message ||
                                "Ocurrió un error inesperado."
                            )}
                        </p>

                    </div>

                `;

            }

        }


        // =====================================================
        // MOSTRAR ACCESORIO
        // =====================================================

        function mostrarAccesorio(datos) {

            const ficha =
                document.getElementById("ficha");


            // =================================================
            // FOTOGRAFÍA
            // =================================================

            let fotografia = "";


            if (
                Array.isArray(datos.fotografia)
                &&
                datos.fotografia.length > 0
                &&
                datos.fotografia[0]
            ) {

                fotografia =
                    datos.fotografia[0].url ||
                    datos.fotografia[0].thumbnails?.large?.url ||
                    datos.fotografia[0].thumbnails?.full?.url ||
                    "";

            }


            // =================================================
            // FOTO HTML
            // =================================================

            const fotoHTML =
                fotografia

                    ? `

                        <div class="foto-contenedor">

                            <img
                                src="${escapeAttribute(fotografia)}"
                                alt="${escapeAttribute(
                                    datos.nombre ||
                                    "Accesorio biomédico"
                                )}"
                                class="foto-accesorio"
                                onerror="this.style.display='none';"
                            >

                        </div>

                    `

                    : "";


            // =================================================
            // EQUIPOS RELACIONADOS
            // =================================================

            let equipos = [];


            if (
                Array.isArray(
                    datos.equiposRelacionados
                )
            ) {

                equipos =
                    datos.equiposRelacionados;

            }


            // -------------------------------------------------
            // SI EL SERVIDOR DEVUELVE UN SOLO OBJETO
            // -------------------------------------------------

            else if (
                datos.equiposRelacionados
                &&
                typeof datos.equiposRelacionados === "object"
            ) {

                equipos = [
                    datos.equiposRelacionados
                ];

            }


            // =================================================
            // HTML DE EQUIPOS
            // =================================================

            let equiposHTML = "";


            if (equipos.length === 0) {

                equiposHTML = `

                    <div class="sin-equipo">

                        No hay equipos relacionados registrados.

                    </div>

                `;

            } else {

                equiposHTML = `

                    <div class="equipos-relacionados">

                        ${equipos.map(
                            equipo => `

                                <div class="equipo-relacionado">

                                    <h3>
                                        ${escapeHTML(
                                            obtenerValor(
                                                equipo.nombre,
                                                "Equipo sin nombre"
                                            )
                                        )}
                                    </h3>


                                    <div class="equipo-grid">


                                        <div class="equipo-dato">

                                            <strong>
                                                Número de activo fijo
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.numeroActivo,
                                                        "No registrado"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Área / Servicio
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.servicio,
                                                        "No registrado"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Marca
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.marca,
                                                        "No registrada"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Modelo
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.modelo,
                                                        "No registrado"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Número de serie
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.serie,
                                                        "No registrado"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Ubicación
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.ubicacion,
                                                        "No registrada"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Estado
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.estado,
                                                        "No registrado"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="equipo-dato">

                                            <strong>
                                                Criticidad
                                            </strong>

                                            <span>
                                                ${escapeHTML(
                                                    obtenerValor(
                                                        equipo.criticidad,
                                                        "No registrada"
                                                    )
                                                )}
                                            </span>

                                        </div>


                                    </div>

                                </div>

                            `
                        ).join("")}

                    </div>

                `;

            }


            // =================================================
            // FICHA COMPLETA
            // =================================================

            ficha.innerHTML = `

                <div class="titulo-ficha">

                    <h2>
                        ${escapeHTML(
                            obtenerValor(
                                datos.nombre,
                                "Accesorio Biomédico"
                            )
                        )}
                    </h2>

                    <p>
                        Ficha Técnica del Accesorio
                    </p>

                </div>


                ${fotoHTML}


                <!-- =========================================
                     INFORMACIÓN DEL ACCESORIO
                ========================================== -->

                <div class="info-section">

                    <h2>
                        📋 Información del Accesorio
                    </h2>


                    <div class="info-grid">


                        <div class="info-item">

                            <strong>
                                Nombre del accesorio
                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.nombre,
                                        "No registrado"
                                    )
                                )}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Número de activo fijo
                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.numeroActivo,
                                        "No registrado"
                                    )
                                )}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Número de serie
                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.serie,
                                        "No registrado"
                                    )
                                )}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Modelo
                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.modelo,
                                        "No registrado"
                                    )
                                )}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>

                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.estado,
                                        "No registrado"
                                    )
                                )}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Color
                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.color,
                                        "No registrado"
                                    )
                                )}
                            </span>

                        </div>

                            <strong>
                                Activo
                            </strong>

                            <span>
                                ${datos.activo === true ? "Sí" : "No"}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Observaciones
                            </strong>

                            <span>
                                ${escapeHTML(
                                    obtenerValor(
                                        datos.observaciones,
                                        "Sin observaciones"
                                    )
                                )}
                            </span>

                        </div>


                    </div>

                </div>


                <!-- =========================================
                     EQUIPO(S) RELACIONADO(S)
                ========================================== -->

                <div class="info-section">

                    <h2>
                        🔗 Equipo(s) relacionado(s)
                    </h2>

                    ${equiposHTML}

                </div>

            `;

        }


        // =====================================================
        // OBTENER VALOR SEGURO
        // =====================================================

        function obtenerValor(valor, defecto) {

            if (
                valor === null ||
                valor === undefined ||
                valor === ""
            ) {

                return defecto;

            }


            if (Array.isArray(valor)) {

                if (valor.length === 0) {

                    return defecto;

                }


                return valor
                    .map(item => {

                        if (
                            item !== null &&
                            typeof item === "object"
                        ) {

                            return (
                                item.name ||
                                item.nombre ||
                                item.value ||
                                item.id ||
                                ""
                            );

                        }

                        return String(item);

                    })
                    .filter(Boolean)
                    .join(", ");

            }


            if (typeof valor === "object") {

                return (
                    valor.name ||
                    valor.nombre ||
                    valor.value ||
                    valor.id ||
                    defecto
                );

            }


            return String(valor);

        }


        // =====================================================
        // PROTEGER TEXTO HTML
        // =====================================================

        function escapeHTML(valor) {

            const div =
                document.createElement("div");

            div.textContent =
                obtenerValor(valor, "");

            return div.innerHTML;

        }


        // =====================================================
        // PROTEGER ATRIBUTOS HTML
        // =====================================================

        function escapeAttribute(valor) {

            return escapeHTML(valor)
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =====================================================
        // INICIAR
        // =====================================================

        cargarAccesorio();

    </script>
