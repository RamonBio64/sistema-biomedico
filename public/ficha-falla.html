<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Reporte de Falla | Sistema Biomédico
</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    background:
        #eef2f5;
    color:
        #263238;
}

button,
a {
    font-family:
        inherit;
}


/* =========================================================
   ENCABEZADO
========================================================= */

header {
    background:
        linear-gradient(
            135deg,
            #0b3d4a 0%,
            #10596a 55%,
            #126579 100%
        );
    color: white;
    padding: 18px 25px;
    box-shadow:
        0 3px 14px
        rgba(0,0,0,0.16);
}

.header-content {
    max-width: 1120px;
    margin: auto;

    display: flex;
    align-items: center;

    gap: 17px;
}

.logo {
    width: 62px;
    height: 62px;

    object-fit: contain;

    background: white;

    border-radius: 12px;

    padding: 5px;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,0.18);
}

.header-text h1 {
    margin: 0;

    font-size: 21px;

    letter-spacing: 0.3px;
}

.header-text p {
    margin: 5px 0 0;

    font-size: 13px;

    letter-spacing: 1px;

    opacity: 0.88;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor {
    max-width: 1050px;

    margin: 28px auto 45px;

    padding:
        0 18px;
}


/* =========================================================
   BOTONES
========================================================= */

.acciones {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;

    margin-bottom: 18px;
}

.boton {
    border: none;

    border-radius: 9px;

    padding:
        11px 17px;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    text-decoration: none;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
}

.boton:hover {
    transform:
        translateY(-1px);

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.12);
}

.boton-regresar {
    background:
        #0b3d4a;

    color:
        white;
}

.boton-regresar:hover {
    background:
        #126579;
}

.boton-imprimir {
    background:
        white;

    color:
        #0b3d4a;

    border:
        1px solid #d4dfe4;
}

.boton-imprimir:hover {
    background:
        #f5f8f9;
}


/* =========================================================
   ENCABEZADO DEL REPORTE
========================================================= */

.reporte-header {
    position: relative;

    background:
        white;

    border-radius:
        14px;

    padding:
        24px 27px;

    margin-bottom:
        18px;

    box-shadow:
        0 3px 13px
        rgba(20,45,55,0.08);

    border:
        1px solid #e1e8eb;

    border-left:
        5px solid #c62828;

    overflow: hidden;
}

.reporte-header::after {
    content: "";

    position: absolute;

    right: -45px;
    top: -55px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(198,40,40,0.045);
}

.reporte-titulo {
    position: relative;

    z-index: 1;
}

.reporte-etiqueta {
    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 8px;

    font-size: 11px;

    font-weight: 800;

    color:
        #c62828;

    text-transform:
        uppercase;

    letter-spacing:
        1.1px;
}

.reporte-header h2 {
    position: relative;

    z-index: 1;

    margin:
        0 0 11px;

    color:
        #173f4a;

    font-size:
        25px;

    letter-spacing:
        -0.3px;
}

.reporte-meta {
    position: relative;

    z-index: 1;

    display: flex;

    flex-wrap: wrap;

    align-items: center;

    gap: 10px 25px;
}

.numero-reporte {
    font-size:
        15px;

    font-weight:
        800;

    color:
        #0b3d4a;
}

.fecha-reporte {
    color:
        #607d8b;

    font-size:
        13px;
}


/* =========================================================
   SECCIONES
========================================================= */

.seccion {
    background:
        white;

    border-radius:
        14px;

    padding:
        22px;

    margin-bottom:
        18px;

    box-shadow:
        0 3px 13px
        rgba(20,45,55,0.07);

    border:
        1px solid #e2e9ec;
}

.seccion h3 {
    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    margin:
        0 0 18px;

    color:
        #0b3d4a;

    font-size:
        15px;

    font-weight:
        800;

    padding-bottom:
        12px;

    border-bottom:
        1px solid #e3eaed;
}

.seccion h3 .linea {
    width:
        4px;

    height:
        20px;

    background:
        #126579;

    border-radius:
        3px;
}


/* =========================================================
   GRID
========================================================= */

.grid {
    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        11px;
}


/* =========================================================
   DATOS
========================================================= */

.dato {
    min-width:
        0;

    background:
        #f7f9fa;

    padding:
        13px 15px;

    border-radius:
        9px;

    border:
        1px solid #e8edef;

    border-left:
        3px solid #126579;

    transition:
        border-color 0.15s ease,
        background 0.15s ease;
}

.dato:hover {
    background:
        #f4f7f8;

    border-left-color:
        #0b3d4a;
}

.dato strong {
    display:
        block;

    color:
        #71838c;

    font-size:
        10px;

    text-transform:
        uppercase;

    letter-spacing:
        0.65px;

    margin-bottom:
        6px;
}

.dato span {
    display:
        block;

    font-size:
        14px;

    font-weight:
        600;

    color:
        #263f48;

    white-space:
        pre-wrap;

    word-break:
        break-word;

    line-height:
        1.4;
}


/* =========================================================
   ESTADO
========================================================= */

.estado {
    display:
        inline-flex !important;

    align-items:
        center;

    gap:
        6px;

    padding:
        6px 11px;

    border-radius:
        20px;

    font-size:
        11px !important;

    font-weight:
        800 !important;

    white-space:
        nowrap !important;
}

.estado::before {
    content:
        "";

    width:
        7px;

    height:
        7px;

    border-radius:
        50%;

    background:
        currentColor;
}

.estado-pendiente {
    background:
        #fff8e1;

    color:
        #ef8f00;
}

.estado-en-proceso {
    background:
        #e8f2fb;

    color:
        #1565c0;
}

.estado-atendido,
.estado-resuelto,
.estado-cerrado {
    background:
        #e8f5e9;

    color:
        #2e7d32;
}

.estado-cancelado {
    background:
        #eceff1;

    color:
        #455a64;
}


/* =========================================================
   DESCRIPCIÓN
========================================================= */

.descripcion {
    background:
        #f8fafb;

    border:
        1px solid #e5ebee;

    border-left:
        4px solid #c62828;

    border-radius:
        9px;

    padding:
        17px 18px;

    line-height:
        1.65;

    color:
        #37474f;

    font-size:
        14px;

    white-space:
        pre-wrap;

    word-break:
        break-word;
}

.descripcion.vacia {
    color:
        #78909c;

    font-style:
        italic;
}


/* =========================================================
   FOTOGRAFÍA
========================================================= */

.fotografia-contenedor {
    min-height:
        180px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    background:
        #f5f8f9;

    border:
        1px solid #e0e7ea;

    border-radius:
        11px;

    padding:
        20px;

    overflow:
        hidden;
}

.fotografia-contenedor img {
    display:
        block;

    max-width:
        100%;

    max-height:
        470px;

    width:
        auto;

    height:
        auto;

    object-fit:
        contain;

    border-radius:
        8px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

    background:
        white;
}

.sin-fotografia {
    color:
        #78909c;

    padding:
        35px;

    font-size:
        13px;
}


/* =========================================================
   CARGANDO
========================================================= */

.cargando {
    background:
        white;

    border-radius:
        14px;

    padding:
        55px 30px;

    text-align:
        center;

    color:
        #607d8b;

    box-shadow:
        0 3px 13px
        rgba(20,45,55,0.07);
}


/* =========================================================
   ERROR
========================================================= */

.error {
    background:
        #fff5f5;

    color:
        #b71c1c;

    border:
        1px solid #ffcdd2;

    border-left:
        5px solid #c62828;

    padding:
        20px;

    border-radius:
        12px;

    text-align:
        center;

    font-weight:
        bold;
}


/* =========================================================
   PIE VISUAL
========================================================= */

.reporte-footer {
    text-align:
        center;

    color:
        #90a4ae;

    font-size:
        11px;

    padding:
        5px 0 15px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    header {
        padding:
            15px;
    }

    .header-content {
        gap:
            12px;
    }

    .logo {
        width:
            54px;

        height:
            54px;
    }

    .header-text h1 {
        font-size:
            17px;
    }

    .header-text p {
        font-size:
            10px;

        letter-spacing:
            0.7px;
    }

    .contenedor {
        margin-top:
            18px;

        padding:
            0 12px;
    }

    .acciones {
        flex-direction:
            column;

        align-items:
            stretch;
    }

    .boton {
        width:
            100%;
    }

    .reporte-header {
        padding:
            20px;
    }

    .reporte-header h2 {
        font-size:
            21px;
    }

    .reporte-meta {
        flex-direction:
            column;

        align-items:
            flex-start;

        gap:
            7px;
    }

    .seccion {
        padding:
            17px;
    }

    .grid {
        grid-template-columns:
            1fr;
    }

}


/* =========================================================
   IMPRESIÓN
========================================================= */

@media print {

    @page {
        size:
            Letter;

        margin:
            11mm;
    }

    body {
        background:
            white;

        color:
            #263238;

        font-size:
            10px;
    }

    header {
        box-shadow:
            none;

        padding:
            8px 10px;
    }

    .header-content {
        max-width:
            100%;
    }

    .logo {
        width:
            42px;

        height:
            42px;
    }

    .header-text h1 {
        font-size:
            14px;
    }

    .header-text p {
        font-size:
            8px;
    }

    .acciones {
        display:
            none;
    }

    .contenedor {
        max-width:
            100%;

        margin:
            8px 0;

        padding:
            0;
    }

    .reporte-header,
    .seccion {
        box-shadow:
            none !important;

        break-inside:
            avoid;

        page-break-inside:
            avoid;
    }

    .reporte-header {
        padding:
            12px 14px;

        margin-bottom:
            8px;
    }

    .reporte-header h2 {
        font-size:
            17px;
    }

    .reporte-etiqueta {
        font-size:
            8px;
    }

    .numero-reporte {
        font-size:
            11px;
    }

    .fecha-reporte {
        font-size:
            9px;
    }

    .seccion {
        padding:
            11px 13px;

        margin-bottom:
            8px;
    }

    .seccion h3 {
        font-size:
            11px;

        margin-bottom:
            9px;

        padding-bottom:
            6px;
    }

    .grid {
        gap:
            5px;
    }

    .dato {
        padding:
            7px 9px;

        border-left-width:
            2px;
    }

    .dato strong {
        font-size:
            7px;

        margin-bottom:
            2px;
    }

    .dato span {
        font-size:
            9px;
    }

    .estado {
        font-size:
            8px !important;

        padding:
            4px 8px;
    }

    .estado::before {
        width:
            5px;

        height:
            5px;
    }

    .descripcion {
        padding:
            8px 10px;

        font-size:
            9px;

        line-height:
            1.45;
    }

    .fotografia-contenedor {
        padding:
            10px;

        min-height:
            80px;
    }

    .fotografia-contenedor img {
        max-height:
            270px;

        box-shadow:
            none;
    }

    .sin-fotografia {
        padding:
            15px;

        font-size:
            9px;
    }

    .reporte-footer {
        font-size:
            8px;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-content">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo institucional"
        >

        <div class="header-text">

            <h1>
                ÁREA DE INGENIERÍA BIOMÉDICA
            </h1>

            <p>
                GESTIÓN DE EQUIPO BIOMÉDICO
            </p>

        </div>

    </div>

</header>


<main class="contenedor">

    <div class="acciones">

        <a
            href="#"
            id="boton-regresar"
            class="boton boton-regresar"
        >
            ← Regresar a reportes
        </a>

        <button
            type="button"
            class="boton boton-imprimir"
            onclick="window.print()"
        >
            🖨️ Imprimir reporte
        </button>

    </div>


    <div id="contenido">

        <div class="cargando">
            Cargando reporte...
        </div>

    </div>

</main>


<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );

const fallaId =
    parametros.get("fallaId");

const equipoId =
    parametros.get("equipoId");


function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "No especificado";
    }

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function obtenerDato(
    objeto,
    ...nombres
) {

    for (
        const nombre of nombres
    ) {

        if (
            objeto &&
            objeto[nombre] !== undefined &&
            objeto[nombre] !== null &&
            objeto[nombre] !== ""
        ) {

            return objeto[nombre];

        }

    }

    return "";

}


function formatearFecha(valor) {

    if (!valor) {
        return "No especificado";
    }

    const fecha =
        new Date(valor);

    if (
        !isNaN(
            fecha.getTime()
        )
    ) {

        return fecha.toLocaleString(
            "es-MX",
            {
                day:
                    "2-digit",
                month:
                    "2-digit",
                year:
                    "numeric",
                hour:
                    "2-digit",
                minute:
                    "2-digit"
            }
        );

    }

    return escaparHTML(valor);

}


function claseEstado(estado) {

    const texto =
        String(
            estado || ""
        )
            .toLowerCase()
            .replace(
                /\s+/g,
                "-"
            );

    if (
        texto.includes("pendiente") ||
        texto.includes("reportada")
    ) {
        return "estado-pendiente";
    }

    if (
        texto.includes("proceso") ||
        texto.includes("revisión") ||
        texto.includes("revision")
    ) {
        return "estado-en-proceso";
    }

    if (
        texto.includes("atendido") ||
        texto.includes("resuelto") ||
        texto.includes("cerrado") ||
        texto.includes("solucionada")
    ) {
        return "estado-resuelto";
    }

    if (
        texto.includes("cancelado")
    ) {
        return "estado-cancelado";
    }

    return "estado-pendiente";

}


function obtenerFotografia(
    valor
) {

    if (!valor) {
        return "";
    }

    if (
        Array.isArray(valor)
    ) {

        if (
            valor.length === 0
        ) {
            return "";
        }

        return (
            valor[0].url ||
            ""
        );

    }

    if (
        typeof valor === "string"
    ) {

        return valor;

    }

    return "";

}


function mostrarError(mensaje) {

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="error">

            ❌ ${escaparHTML(
                mensaje
            )}

        </div>

    `;

}


async function cargarReporte() {

    try {

        const respuesta =
            await fetch(
                `/api/falla/${encodeURIComponent(
                    fallaId
                )}`
            );

        const datos =
            await respuesta.json();

        if (
            !respuesta.ok
        ) {

            throw new Error(
                datos.error ||
                datos.mensaje ||
                "No se pudo cargar el reporte."
            );

        }


        const reporte =
            datos.falla ||
            datos.reporte ||
            datos;


        const equipo =
            reporte.equipo ||
            datos.equipo ||
            {};


        const numeroReporte =
            obtenerDato(
                reporte,
                "numeroReporte",
                "Número de reporte"
            ) ||
            "Reporte de falla";


        const fechaHora =
            obtenerDato(
                reporte,
                "fechaHora",
                "Fecha y hora"
            );


        const reportadoPor =
            obtenerDato(
                reporte,
                "reportadoPor",
                "Reportado por"
            );


        const tipoFalla =
            obtenerDato(
                reporte,
                "tipoFalla",
                "Tipo de falla"
            );


        const descripcion =
            obtenerDato(
                reporte,
                "descripcionFalla",
                "Descripción de la falla"
            );


        const estadoFalla =
            obtenerDato(
                reporte,
                "estadoFalla",
                "Estado de la falla"
            ) ||
            "Reportada";


        const observaciones =
            obtenerDato(
                reporte,
                "observaciones",
                "Observaciones"
            );


        const fotografia =
            obtenerFotografia(
                obtenerDato(
                    reporte,
                    "fotografia",
                    "Fotografía del error"
                )
            );


        const nombreEquipo =
            obtenerDato(
                equipo,
                "nombre"
            ) ||
            obtenerDato(
                reporte,
                "nombreEquipo",
                "Nombre del equipo"
            );


        const numeroActivo =
            obtenerDato(
                equipo,
                "numeroActivo",
                "Numero de activo fijo"
            ) ||
            obtenerDato(
                reporte,
                "numeroActivo",
                "Número de activo fijo"
            );


        const marca =
            obtenerDato(
                equipo,
                "marca"
            );


        const modelo =
            obtenerDato(
                equipo,
                "modelo"
            );


        const serie =
            obtenerDato(
                equipo,
                "serie",
                "numeroSerie"
            );


        const servicio =
            obtenerDato(
                equipo,
                "servicio",
                "servicioArea"
            );


        const ubicacion =
            obtenerDato(
                equipo,
                "ubicacion"
            );


        const estadoEquipo =
            obtenerDato(
                equipo,
                "estado"
            );


        const criticidad =
            obtenerDato(
                equipo,
                "criticidad"
            );


        document.getElementById(
            "contenido"
        ).innerHTML = `


            <!-- ENCABEZADO DEL REPORTE -->

            <section class="reporte-header">

                <div class="reporte-titulo">

                    <div class="reporte-etiqueta">
                        🔴 Registro de incidencia
                    </div>

                    <h2>
                        REPORTE DE FALLA / ALARMA
                    </h2>

                    <div class="reporte-meta">

                        <div class="numero-reporte">

                            Número de reporte:
                            ${escaparHTML(
                                numeroReporte
                            )}

                        </div>

                        <div class="fecha-reporte">

                            Fecha del reporte:
                            ${formatearFecha(
                                fechaHora
                            )}

                        </div>

                    </div>

                </div>

            </section>


            <!-- INFORMACIÓN DEL REPORTE -->

            <section class="seccion">

                <h3>
                    👤
                    <span class="linea"></span>
                    Información del reporte
                </h3>

                <div class="grid">


                    <div class="dato">

                        <strong>
                            Reportado por
                        </strong>

                        <span>
                            ${escaparHTML(
                                reportadoPor
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Estado de la falla
                        </strong>

                        <span>

                            <span
                                class="estado ${claseEstado(
                                    estadoFalla
                                )}"
                            >
                                ${escaparHTML(
                                    estadoFalla
                                )}
                            </span>

                        </span>

                    </div>


                </div>

            </section>


            <!-- INFORMACIÓN DEL EQUIPO -->

            <section class="seccion">

                <h3>
                    🏥
                    <span class="linea"></span>
                    Información del equipo
                </h3>

                <div class="grid">


                    <div class="dato">

                        <strong>
                            Nombre del equipo
                        </strong>

                        <span>
                            ${escaparHTML(
                                nombreEquipo
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Número de activo fijo
                        </strong>

                        <span>
                            ${escaparHTML(
                                numeroActivo
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Marca
                        </strong>

                        <span>
                            ${escaparHTML(
                                marca
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Modelo
                        </strong>

                        <span>
                            ${escaparHTML(
                                modelo
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Número de serie
                        </strong>

                        <span>
                            ${escaparHTML(
                                serie
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Área
                        </strong>

                        <span>
                            ${escaparHTML(
                                servicio
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Ubicación
                        </strong>

                        <span>
                            ${escaparHTML(
                                ubicacion
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Estado del equipo
                        </strong>

                        <span>
                            ${escaparHTML(
                                estadoEquipo
                            )}
                        </span>

                    </div>


                    <div class="dato">

                        <strong>
                            Criticidad
                        </strong>

                        <span>
                            ${escaparHTML(
                                criticidad
                            )}
                        </span>

                    </div>


                </div>

            </section>


            <!-- FALLA -->

            <section class="seccion">

                <h3>
                    🔴
                    <span class="linea"></span>
                    Descripción de la falla
                </h3>


                <div class="grid">


                    <div class="dato">

                        <strong>
                            Tipo de falla
                        </strong>

                        <span>
                            ${escaparHTML(
                                tipoFalla
                            )}
                        </span>

                    </div>


                </div>


                <div
                    class="descripcion"
                    style="margin-top:11px;"
                >

                    ${escaparHTML(
                        descripcion
                    )}

                </div>

            </section>


            <!-- FOTOGRAFÍA -->

            <section class="seccion">

                <h3>
                    📷
                    <span class="linea"></span>
                    Fotografía del error
                </h3>

                <div class="fotografia-contenedor">

                    ${
                        fotografia
                        ?
                        `

                            <img
                                src="${escaparHTML(
                                    fotografia
                                )}"
                                alt="Fotografía del error"
                            >

                        `
                        :
                        `

                            <div class="sin-fotografia">

                                No se adjuntó una fotografía para este reporte.

                            </div>

                        `
                    }

                </div>

            </section>


            <!-- OBSERVACIONES -->

            <section class="seccion">

                <h3>
                    📝
                    <span class="linea"></span>
                    Observaciones
                </h3>

                <div class="descripcion">

                    ${escaparHTML(
                        observaciones
                    )}

                </div>

            </section>


            <div class="reporte-footer">

                Sistema Biomédico · Área de Ingeniería Biomédica

            </div>

        `;


    } catch (error) {

        console.error(
            "Error cargando reporte:",
            error
        );

        mostrarError(
            error.message ||
            "No se pudo cargar el reporte."
        );

    }

}


if (!fallaId) {

    mostrarError(
        "No se encontró el identificador del reporte."
    );

} else {

    const regresar =
        document.getElementById(
            "boton-regresar"
        );

    if (regresar) {

        if (equipoId) {

            regresar.href =
                `/reportes-falla.html?equipoId=${encodeURIComponent(
                    equipoId
                )}`;

        } else {

            regresar.href =
                "/";

        }

    }

    cargarReporte();

}

</script>

</body>

</html>
