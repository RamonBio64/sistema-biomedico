<main class="contenedor">

        </a>

            🖨️ Imprimir reporte
        </button>
    </div>

    <div id="contenido">
        <div class="cargando">Cargando reporte...</div>
    </div>

</main>

<script>
const parametros = new URLSearchParams(window.location.search);
const fallaId = parametros.get("fallaId");
const equipoId = parametros.get("equipoId");
const CLAVE_SESION_TECNICO = "tokenTecnicoFallas";

/* ESCAPAR HTML */
function escaparHTML(valor) {
    if (valor === null || valor === undefined || valor === "") {
        return "No especificado";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* OBTENER DATO */
function obtenerDato(objeto, ...nombres) {
    for (const nombre of nombres) {
        if (
            objeto &&
            objeto[nombre] !== undefined &&
            objeto[nombre] !== null &&
            objeto[nombre] !== ""
        ) {
            return objeto[nombre];
        }
    }

    return "";
}

/* FECHA */
function formatearFecha(valor) {
    if (!valor) return "No especificado";

    const fecha = new Date(valor);

    if (!isNaN(fecha.getTime())) {
        return fecha.toLocaleString("es-MX", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    return escaparHTML(valor);
}

/* CLASE DEL ESTADO */
function claseEstado(estado) {
    const texto = String(estado || "")
        .toLowerCase()
        .replace(/\s+/g, "-");

    if (texto.includes("pendiente") || texto.includes("reportada")) {
        return "estado-pendiente";
    }

    if (
        texto.includes("proceso") ||
        texto.includes("revisión") ||
        texto.includes("revision") ||
        texto.includes("en-revision")
    ) {
        return "estado-en-proceso";
    }

    if (
        texto.includes("atendido") ||
        texto.includes("resuelto") ||
        texto.includes("cerrado") ||
        texto.includes("solucionado")
    ) {
        return "estado-resuelto";
    }

    if (texto.includes("cancelado")) {
        return "estado-cancelado";
    }

    return "estado-pendiente";
}

/* OBTENER FOTOGRAFÍA */
function obtenerFotografia(valor) {
    if (valor === null || valor === undefined || valor === "") {
        return "";
    }

    if (Array.isArray(valor)) {
        if (valor.length === 0) return "";

        const primero = valor[0];

        if (
            primero &&
            typeof primero === "object" &&
            typeof primero.url === "string"
        ) {
            return primero.url;
        }

        if (typeof primero === "number") return "";

        return "";
    }

    if (typeof valor === "object") {
        if (typeof valor.url === "string") return valor.url;
        return "";
    }

    if (typeof valor === "string") {
        const texto = valor.trim();

        if (!texto) return "";

        const pareceArrayNumerico = /^\s*\d+(\s*,\s*\d+)+\s*$/.test(texto);

        if (pareceArrayNumerico) return "";

        if (
            texto.startsWith("http://") ||
            texto.startsWith("https://") ||
            texto.startsWith("data:image/")
        ) {
            return texto;
        }

        return "";
    }

    return "";
}

/* MOSTRAR ERROR GENERAL */
function mostrarError(mensaje) {
    document.getElementById("contenido").innerHTML = `
        <div class="error">
            ❌ ${escaparHTML(mensaje)}
        </div>
    `;
}

/* MOSTRAR MENSAJE DEL TÉCNICO */
function mostrarMensajeTecnico(mensaje, tipo) {
    const elemento = document.getElementById("mensaje-tecnico");

    if (!elemento) return;

    elemento.className = "tecnico-mensaje visible " + tipo;
    elemento.textContent = mensaje;
}

/* CARGAR REPORTE */
async function cargarReporte() {
    try {
        const respuesta = await fetch(
            `/api/falla/${encodeURIComponent(fallaId)}`
        );

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(
                datos.error ||
                datos.mensaje ||
                "No se pudo cargar el reporte."
            );
        }

        const reporte = datos.falla || datos.reporte || datos;
        const equipo = reporte.equipo || datos.equipo || {};

        /* DATOS DEL REPORTE */
        const numeroReporte = obtenerDato(
            reporte,
            "numeroReporte",
            "Número de reporte",
            "ID Falla"
        ) || "Reporte de falla";

        const fechaHora = obtenerDato(
            reporte,
            "fechaHora",
            "Fecha y hora",
            "Fecha y hora del reporte"
        );

        const reportadoPor = obtenerDato(
            reporte,
            "reportadoPor",
            "Reportado por"
        );

        const tipoFalla = obtenerDato(
            reporte,
            "tipoFalla",
            "Tipo de falla"
        );

        const descripcion = obtenerDato(
            reporte,
            "descripcionFalla",
            "Descripción de la falla"
        );

        const estadoFalla = obtenerDato(
            reporte,
            "estadoFalla",
            "Estado de la falla",
            "Estado"
        ) || "Reportada";

        /* SOLUCIÓN */
        const solucion = obtenerDato(
            reporte,
            "solucion",
            "Solución",
            "Solucion"
        );

        /* FOTOGRAFÍA */
        const fotografiaValor = obtenerDato(
            reporte,
            "fotografia",
            "Fotografía del error",
            "Fotografia del error"
        );

        const fotografia = obtenerFotografia(fotografiaValor);

        /* DATOS DEL EQUIPO */
        const nombreEquipo = obtenerDato(equipo, "nombre") ||
            obtenerDato(
                reporte,
                "nombreEquipo",
                "Nombre del equipo",
                "Nombre del equipo relacionado"
            );

        const numeroActivo = obtenerDato(
            equipo,
            "numeroActivo",
            "Numero de activo fijo",
            "Número de activo fijo"
        ) || obtenerDato(
            reporte,
            "numeroActivo",
            "Número de activo fijo",
            "Numero de activo fijo"
        );

        const marca = obtenerDato(equipo, "marca", "Marca");
        const modelo = obtenerDato(equipo, "modelo", "Modelo");

        const serie = obtenerDato(
            equipo,
            "serie",
            "numeroSerie",
            "Número de serie"
        );

        const servicio = obtenerDato(
            equipo,
            "servicio",
            "servicioArea",
            "servicio o área"
        );

        const ubicacion = obtenerDato(equipo, "ubicacion", "Ubicación");

        const estadoEquipo = obtenerDato(
            equipo,
            "estado",
            "Estado del equipo"
        );

        const criticidad = obtenerDato(
            equipo,
            "criticidad",
            "Criticidad"
        );

        /* CONSTRUIR PÁGINA */
        document.getElementById("contenido").innerHTML = `

            <section class="reporte-header">
                <div class="reporte-titulo">
                    <div class="reporte-etiqueta">
                        🔴 Registro de incidencia
                    </div>

                    <h2>REPORTE DE FALLA / ALARMA</h2>

                    <div class="reporte-meta">
                        <div class="numero-reporte">
                            Número de reporte: ${escaparHTML(numeroReporte)}
                        </div>

                        <div class="fecha-reporte">
                            Fecha del reporte: ${formatearFecha(fechaHora)}
                        </div>
                    </div>
                </div>
            </section>

            <section class="seccion">
                <h3>
                    👤 <span class="linea"></span>
                    Información del reporte
                </h3>

                <div class="grid">
                    <div class="dato">
                        <strong>Reportado por</strong>
                        <span>${escaparHTML(reportadoPor)}</span>
                    </div>

                    <div class="dato">

        /* =========================================
           ACCESO TÉCNICO
        ========================================= */

        const formularioAcceso = document.getElementById(
            "form-acceso-tecnico"
        );

        const campoPassword = document.getElementById(
            "password-tecnico"
        );

        const editorTecnico = document.getElementById(
            "editor-tecnico"
        );

        const campoEstado = document.getElementById(
            "estado-tecnico"
        );

        const campoSolucion = document.getElementById(
            "solucion-tecnica"
        );

        const botonAcceder = document.getElementById(
            "boton-acceder-tecnico"
        );

        const botonGuardar = document.getElementById(
            "guardar-solucion"
        );

        const botonCerrarSesion = document.getElementById(
            "cerrar-sesion-tecnico"
        );

        function mostrarEditorTecnico() {
            formularioAcceso.hidden = true;
            editorTecnico.hidden = false;

            campoEstado.value = [
                "Reportada",
                "En proceso",
                "Solucionada"
            ].includes(String(estadoFalla))
                ? String(estadoFalla)
                : "Reportada";

            campoSolucion.value = solucion || "";
        }

        function mostrarAccesoTecnico() {
            formularioAcceso.hidden = false;
            editorTecnico.hidden = true;
            campoPassword.value = "";
        }

        /* Si existe un token de sesión, mostrar el editor */
        const tokenGuardado = sessionStorage.getItem(
            CLAVE_SESION_TECNICO
        );

        if (tokenGuardado) {
            mostrarEditorTecnico();
        }

        /* INICIAR SESIÓN */
        formularioAcceso.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const password = campoPassword.value;

            if (!password) {
                mostrarMensajeTecnico(
                    "Ingresa la contraseña del personal técnico.",
                    "error-mensaje"
                );
                return;
            }

            botonAcceder.disabled = true;
            botonAcceder.textContent = "Verificando...";

            try {
                const respuestaAcceso = await fetch("/api/fallas/acceso", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password: password })
                });

                const resultadoAcceso = await respuestaAcceso.json();

                if (
                    !respuestaAcceso.ok ||
                    !resultadoAcceso.token
                ) {
                    throw new Error(
                        resultadoAcceso.error ||
                        resultadoAcceso.mensaje ||
                        "No se pudo validar la contraseña."
                    );
                }

                sessionStorage.setItem(
                    CLAVE_SESION_TECNICO,
                    resultadoAcceso.token
                );

                mostrarEditorTecnico();

                mostrarMensajeTecnico(
                    "Acceso autorizado. Ya puedes actualizar la falla.",
                    "exito"
                );

            } catch (error) {
                mostrarMensajeTecnico(
                    error.message ||
                    "Error al validar el acceso técnico.",
                    "error-mensaje"
                );
            } finally {
                botonAcceder.disabled = false;
                botonAcceder.textContent = "Iniciar sesión";
            }
        });

        /* GUARDAR ESTADO Y SOLUCIÓN */
        botonGuardar.addEventListener("click", async function() {
            const token = sessionStorage.getItem(
                CLAVE_SESION_TECNICO
            );

            const nuevoEstado = campoEstado.value;
            const nuevaSolucion = campoSolucion.value.trim();

            if (!token) {
                mostrarAccesoTecnico();

                mostrarMensajeTecnico(
                    "Tu sesión terminó. Inicia sesión nuevamente.",
                    "error-mensaje"
                );
                return;
            }

            if (!nuevaSolucion) {
                mostrarMensajeTecnico(
                    "Escribe la solución aplicada antes de guardar.",
                    "error-mensaje"
                );

                campoSolucion.focus();
                return;
            }

            botonGuardar.disabled = true;
            botonGuardar.textContent = "Guardando...";

            try {
                const respuestaGuardar = await fetch(
                    `/api/falla/${encodeURIComponent(fallaId)}/solucion`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            estado: nuevoEstado,
                            solucion: nuevaSolucion
                        })
                    }
                );

                const resultadoGuardar = await respuestaGuardar.json();

                if (!respuestaGuardar.ok) {
                    if (respuestaGuardar.status === 401) {
                        sessionStorage.removeItem(
                            CLAVE_SESION_TECNICO
                        );

                        mostrarAccesoTecnico();

                        throw new Error(
                            "La sesión expiró. Inicia sesión nuevamente."
                        );
                    }

                    throw new Error(
                        resultadoGuardar.error ||
                        resultadoGuardar.mensaje ||
                        "No se pudieron guardar los cambios."
                    );
                }

                mostrarMensajeTecnico(
                    "Los cambios se guardaron correctamente. Actualizando el reporte...",
                    "exito"
                );

                await cargarReporte();

            } catch (error) {
                mostrarMensajeTecnico(
                    error.message ||
                    "Ocurrió un error al guardar los cambios.",
                    "error-mensaje"
                );
            } finally {
                botonGuardar.disabled = false;
                botonGuardar.textContent = "Guardar cambios";
            }
        });

        /* CERRAR SESIÓN TÉCNICA */
        botonCerrarSesion.addEventListener("click", function() {
            sessionStorage.removeItem(CLAVE_SESION_TECNICO);

            mostrarAccesoTecnico();

            mostrarMensajeTecnico(
                "Se cerró la sesión del personal técnico.",
                "info"
            );
        });

    } catch (error) {
        console.error("Error cargando reporte:", error);

        mostrarError(
            error.message ||
            "No se pudo cargar el reporte."
        );
    }
}

/* INICIO */
if (!fallaId) {

} else {

            regresar.href =

        } else {
            regresar.href = "/";
        }
    }

    cargarReporte();
}
</script>
