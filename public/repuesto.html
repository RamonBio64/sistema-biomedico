<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repuestos Médicos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f8;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #0b3d4a, #126579);
            color: white;
            padding: 18px 20px;
        }

        .header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 5px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitulo {
            margin-top: 5px;
            opacity: .9;
            font-size: 14px;
        }

        main {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 15px;
            color: #126579;
            font-weight: bold;
            text-decoration: none;
        }

        .encabezado {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-bottom: 20px;
        }

        .encabezado h2 {
            color: #0b3d4a;
            margin: 0 0 8px;
        }

        .equipo {
            color: #607d8b;
            font-weight: bold;
        }

        .lista {
            display: grid;
            gap: 12px;
        }

        .repuesto {
            background: white;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            text-decoration: none;
            color: #263238;
            border: 1px solid #dce5e8;
            box-shadow: 0 3px 10px rgba(0,0,0,.05);
            transition: .2s;
        }

        .repuesto:hover {
            transform: translateY(-2px);
            border-color: #126579;
            box-shadow: 0 6px 16px rgba(0,0,0,.10);
        }

        .izquierda {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icono {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #e8f4f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .nombre {
            font-size: 17px;
            font-weight: bold;
            color: #0b3d4a;
        }

        .modelo {
            color: #607d8b;
            font-size: 14px;
            margin-top: 5px;
        }

        .flecha {
            color: #126579;
            font-size: 25px;
            font-weight: bold;
        }

        .cargando,
        .vacio,
        .error {
            background: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
        }

        .error {
            color: #b71c1c;
            background: #ffebee;
        }

        @media(max-width:600px) {

            h1 {
                font-size: 18px;
            }

            .nombre {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo"
        >

        <div>

            <h1>
                REPUESTOS MÉDICOS
            </h1>

            <div class="subtitulo">
                Área de Ingeniería Biomédica
            </div>

        </div>

    </div>

</header>


<main>

    <a
        id="volver"
        class="volver"
        href="#"
    >
        ← Volver a la ficha del equipo
    </a>


    <div class="encabezado">

        <h2>
            🔧 Repuestos
        </h2>

        <div
            id="equipo"
            class="equipo"
        >
            Cargando equipo...
        </div>

    </div>


    <div
        id="lista"
        class="lista"
    >

        <div class="cargando">
            Cargando repuestos...
        </div>

    </div>

</main>


<script>

const parametros =
    new URLSearchParams(window.location.search);

const equipoId =
    parametros.get("equipoId");


function escaparHTML(valor) {

    if (valor === null || valor === undefined) {
        return "No especificado";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


if (!equipoId) {

    document.getElementById("lista").innerHTML = `
        <div class="error">
            ❌ No se encontró el equipo.
        </div>
    `;

} else {

    document.getElementById("volver").href =
        `/?equipoId=${encodeURIComponent(equipoId)}`;

    cargarDatos();

}


async function cargarDatos() {

    try {

        const [respuestaEquipo, respuestaRepuestos] =
            await Promise.all([

                fetch(`/api/equipo/${equipoId}`),

                fetch(`/api/equipo/${equipoId}/repuestos`)

            ]);


        const equipo =
            await respuestaEquipo.json();

        const repuestos =
            await respuestaRepuestos.json();


        if (equipo.correcto) {

            document.getElementById("equipo").textContent =
                `${equipo.nombre || "Equipo"} · Activo: ${equipo.numeroActivo || "No especificado"}`;

        }


        if (
            !repuestos.correcto ||
            !Array.isArray(repuestos.repuestos)
        ) {

            throw new Error(
                "No se pudieron cargar los repuestos."
            );

        }


        const lista =
            repuestos.repuestos;


        if (lista.length === 0) {

            document.getElementById("lista").innerHTML = `
                <div class="vacio">
                    Este equipo no tiene repuestos relacionados.
                </div>
            `;

            return;

        }


        document.getElementById("lista").innerHTML =

            lista.map(repuesto => {

                const url =
                    `/repuesto.html?repuestoId=${encodeURIComponent(repuesto.id)}&equipoId=${encodeURIComponent(equipoId)}`;

                return `

                    <a
                        class="repuesto"
                        href="${url}"
                    >

                        <div class="izquierda">

                            <div class="icono">
                                🔧
                            </div>

                            <div>

                                <div class="nombre">
                                    ${escaparHTML(repuesto.nombre)}
                                </div>

                                <div class="modelo">
                                    Modelo:
                                    ${escaparHTML(repuesto.modelo)}
                                </div>

                            </div>

                        </div>

                        <div class="flecha">
                            →
                        </div>

                    </a>

                `;

            }).join("");


    } catch (error) {

        console.error(error);

        document.getElementById("lista").innerHTML = `

            <div class="error">

                ❌ ${escaparHTML(error.message)}

            </div>

        `;

    }

}

</script>

</body>
</html>
