<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repuestos Médicos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f8;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #0b3d4a, #126579);
            color: white;
            padding: 18px 20px;
        }

        .header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 5px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitulo {
            margin-top: 5px;
            opacity: .9;
            font-size: 14px;
        }

        main {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 15px;
            color: #126579;
            font-weight: bold;
            text-decoration: none;
        }

        .volver:hover {
            text-decoration: underline;
        }

        .encabezado {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-bottom: 20px;
        }

        .encabezado h2 {
            color: #0b3d4a;
            margin: 0 0 8px;
        }

        .equipo {
            color: #607d8b;
            font-weight: bold;
        }

        .lista {
            display: grid;
            gap: 12px;
        }

        .repuesto {
            background: white;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            text-decoration: none;
            color: #263238;
            border: 1px solid #dce5e8;
            box-shadow: 0 3px 10px rgba(0,0,0,.05);
            transition: .2s;
        }

        .repuesto:hover {
            transform: translateY(-2px);
            border-color: #126579;
            box-shadow: 0 6px 16px rgba(0,0,0,.10);
        }

        .izquierda {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .icono {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #e8f4f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            flex-shrink: 0;
        }

        .nombre {
            font-size: 17px;
            font-weight: bold;
            color: #0b3d4a;
            word-break: break-word;
        }

        .modelo {
            color: #607d8b;
            font-size: 14px;
            margin-top: 5px;
        }

        .activo {
            color: #78909c;
            font-size: 13px;
            margin-top: 4px;
        }

        .flecha {
            color: #126579;
            font-size: 25px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .cargando,
        .vacio,
        .error {
            background: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
        }

        .error {
            color: #b71c1c;
            background: #ffebee;
            border: 1px solid #ffcdd2;
        }

        .vacio {
            color: #607d8b;
        }

        @media(max-width:600px) {

            header {
                padding: 15px;
            }

            .header {
                gap: 12px;
            }

            .logo {
                width: 50px;
                height: 50px;
            }

            h1 {
                font-size: 18px;
            }

            .subtitulo {
                font-size: 12px;
            }

            main {
                margin: 18px auto;
            }

            .encabezado {
                padding: 18px;
            }

            .repuesto {
                padding: 15px;
            }

            .icono {
                width: 48px;
                height: 48px;
                font-size: 23px;
            }

            .nombre {
                font-size: 15px;
            }

            .modelo {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header">

        <img
            src="/img/fondo.jfif"
            class="logo"
            alt="Logo"
        >

        <div>

            <h1>
                REPUESTOS MÉDICOS
            </h1>

            <div class="subtitulo">
                Área de Ingeniería Biomédica
            </div>

        </div>

    </div>

</header>


<main>

    <a
        id="volver"
        class="volver"
        href="#"
    >
        ← Volver a la ficha del equipo
    </a>


    <div class="encabezado">

        <h2>
            🔧 Repuestos
        </h2>

        <div
            id="equipo"
            class="equipo"
        >
            Cargando equipo...
        </div>

    </div>


    <div
        id="lista"
        class="lista"
    >

        <div class="cargando">
            Cargando repuestos...
        </div>

    </div>

</main>


<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );

const equipoId =
    parametros.get("equipoId");


function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "No especificado";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


if (!equipoId) {

    document.getElementById("lista").innerHTML = `
        <div class="error">
            ❌ No se encontró el equipo.
        </div>
    `;

    document.getElementById("equipo").textContent =
        "Equipo no especificado";

} else {

    document.getElementById("volver").href =
        `/?equipoId=${encodeURIComponent(equipoId)}`;

    cargarDatos();

}


async function cargarDatos() {

    try {

        const [
            respuestaEquipo,
            respuestaRepuestos
        ] = await Promise.all([

            fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}`
            ),

            fetch(
                `/api/equipo/${encodeURIComponent(equipoId)}/repuestos`
            )

        ]);


        if (!respuestaEquipo.ok) {

            throw new Error(
                "No se pudo cargar la información del equipo."
            );

        }


        if (!respuestaRepuestos.ok) {

            throw new Error(
                "No se pudieron cargar los repuestos."
            );

        }


        const equipo =
            await respuestaEquipo.json();

        const respuestaJSON =
            await respuestaRepuestos.json();


        /*
         * LA API DEL EQUIPO DEVUELVE
         * DIRECTAMENTE EL OBJETO.
         */

        if (
            !equipo ||
            !equipo.id
        ) {

            throw new Error(
                "No se encontró la información del equipo."
            );

        }


        document.getElementById("equipo").textContent =
            `${equipo.nombre || "Equipo"} · Activo: ${equipo.numeroActivo || "No especificado"}`;


        /*
         * LA API DE REPUESTOS DEVUELVE:
         *
         * {
         *     correcto: true,
         *     repuestos: [...]
         * }
         *
         * Por eso debemos obtener
         * respuestaJSON.repuestos
         */

        if (
            !respuestaJSON ||
            !respuestaJSON.correcto ||
            !Array.isArray(
                respuestaJSON.repuestos
            )
        ) {

            console.error(
                "Respuesta recibida:",
                respuestaJSON
            );

            throw new Error(
                "La respuesta de repuestos no tiene un formato válido."
            );

        }


        const lista =
            respuestaJSON.repuestos;


        if (lista.length === 0) {

            document.getElementById("lista").innerHTML = `
                <div class="vacio">
                    Este equipo no tiene repuestos relacionados.
                </div>
            `;

            return;

        }


        document.getElementById("lista").innerHTML =

            lista.map(repuesto => {

                const url =
                    `/ficha-repuesto.html?repuestoId=${encodeURIComponent(repuesto.id)}&equipoId=${encodeURIComponent(equipoId)}`;


                return `

                    <a
                        class="repuesto"
                        href="${url}"
                    >

                        <div class="izquierda">

                            <div class="icono">
                                🔧
                            </div>

                            <div>

                                <div class="nombre">
                                    ${escaparHTML(
                                        repuesto.nombre
                                    )}
                                </div>

                                <div class="modelo">
                                    Modelo:
                                    ${escaparHTML(
                                        repuesto.modelo
                                    )}
                                </div>

                                <div class="activo">
                                    Activo:
                                    ${escaparHTML(
                                        repuesto.numeroActivo
                                    )}
                                </div>

                            </div>

                        </div>

                        <div class="flecha">
                            →
                        </div>

                    </a>

                `;

            }).join("");


    } catch (error) {

        console.error(
            "Error cargando repuestos:",
            error
        );

        document.getElementById("lista").innerHTML = `

            <div class="error">

                ❌ ${escaparHTML(
                    error.message ||
                    "No se pudieron cargar los repuestos."
                )}

            </div>

        `;

    }

}

</script>

</body>
</html>
